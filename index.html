<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4B0C1A">
<title>מערכת ביקורות הרבנות | רבנות פקמ״ז</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-pkmz-192.png">
<link rel="apple-touch-icon" href="icon-pkmz-192.png">
<meta name="mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<meta name="apple-mobile-web-app-title" content="ביקורות הרבנות">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bd:#6E1528;--bd2:#4B0C1A;--bd3:#8E2238;--gold:#C9A227;--gold2:#E8CD6E;--cream:#F7F1E4;--cream2:#EFE5CF;--ink:#2A1A1D;--mut:#7A6A66;--ok:#2F7A4B;--okbg:#E5F2E9;--bad:#B3261E;--badbg:#FBE7E5;--warn:#9A6B00;--warnbg:#FFF3D6;--line:#E3D6BB;--card:#FFFDF8;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Heebo,Arial,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"Frank Ruhl Libre",serif;margin:0}
.hdr{background:linear-gradient(160deg,var(--bd2),var(--bd) 55%,var(--bd3));color:#fff;padding:14px 16px 12px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(60,10,20,.25)}
.hdr-row{display:flex;align-items:center;gap:12px;max-width:900px;margin:0 auto}
.emb{width:48px;height:48px;flex:none;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.hdr.home{padding:8px 16px}
.hdr.home .me{max-width:100%;text-align:right;margin:0;display:flex;gap:8px;align-items:baseline}
.hdr .back{margin-inline-start:auto}
.hero{text-align:center;padding:6px 0 2px}
.hero img{width:132px;height:auto;object-fit:contain;display:block;margin:4px auto 8px;filter:drop-shadow(0 3px 6px rgba(75,12,26,.25))}
.hero h1{font-size:1.75rem;font-weight:900;color:var(--bd2);line-height:1.2}
.hero .sub{font-family:"Frank Ruhl Libre",serif;color:var(--gold);font-weight:900;font-size:1.25rem;margin-top:2px;text-shadow:0 1px 0 rgba(75,12,26,.15)}
.phbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--gold);background:#FFFBEF;color:var(--bd);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.9rem;margin-top:8px;cursor:pointer;min-height:42px}
.phbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.photos .ph{cursor:zoom-in}
.photos .cnt{font-size:.75rem;color:var(--mut)}
body.authmode .nav{display:none}
.authbox{max-width:440px;margin:6px auto;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:16px;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}
.logout{background:rgba(255,255,255,.12);border:1px solid rgba(232,205,110,.5);color:#fff;border-radius:9px;padding:4px 10px;font-weight:700;font-size:.8rem;margin-inline-start:auto}
.sig{width:100%;height:150px;background:#fff;border:1.5px dashed var(--gold);border-radius:10px;touch-action:none;display:block}
.sigimg{max-width:100%;height:110px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
#pdfStage{position:fixed;left:-20000px;top:0;width:794px;pointer-events:none}
.ttl h1{font-size:1.3rem;font-weight:900;letter-spacing:.3px;color:#fff}
.ttl .sub{color:var(--gold2);font-weight:700;font-size:.95rem}
.hdr .me{margin-inline-start:auto;text-align:left;font-size:.8rem;color:#f3e6c8;max-width:40%}
.hdr .me b{display:block;color:#fff;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .back{background:rgba(255,255,255,.12);border:1px solid rgba(232,205,110,.5);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
main{max-width:900px;margin:0 auto;padding:14px 14px 110px}
.slogan{text-align:center;font-family:"Frank Ruhl Libre",serif;color:var(--bd);font-weight:700;font-size:1.1rem;margin:4px 0 14px;display:flex;align-items:center;gap:10px;justify-content:center}
.slogan:before,.slogan:after{content:"";height:1px;flex:1;max-width:70px;background:linear-gradient(90deg,transparent,var(--gold))}
.slogan:after{background:linear-gradient(270deg,transparent,var(--gold))}
.banner{border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.92rem;border:1px solid}
.banner.info{background:#F2ECDD;border-color:var(--line);color:#5a4a3c}
.banner.warn{background:var(--warnbg);border-color:#EBCB7A;color:#6b4a00}
.banner.bad{background:var(--badbg);border-color:#EBB0AA;color:#7a1a14}
.banner .btn{margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat .n{font-family:"Frank Ruhl Libre",serif;font-size:1.7rem;font-weight:900;color:var(--bd);line-height:1.1}
.stat .l{font-size:.75rem;color:var(--mut);font-weight:500}
.stat.r .n{color:var(--bad)}.stat.g .n{color:var(--ok)}.stat.y .n{color:var(--warn)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:16px;padding:18px 12px;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:1.05rem;color:var(--bd2);box-shadow:0 2px 0 rgba(110,21,40,.06);cursor:pointer}
.tile:active{transform:scale(.98)}
.tile .ic{width:54px;height:54px;border-radius:50%;background:var(--bd);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--gold)}
.tile .ic svg{width:28px;height:28px;stroke:var(--gold2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile.main{grid-column:1/-1;background:linear-gradient(160deg,var(--bd),var(--bd3));color:#fff;border-top-color:var(--gold2);min-height:96px;flex-direction:row;font-size:1.2rem}
.tile.main .ic{background:rgba(0,0,0,.2)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.sec-h h2{font-size:1.15rem;color:var(--bd)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.lst .card{cursor:pointer;display:block}
.lst .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lst .num{font-weight:800;color:var(--bd);direction:ltr;unicode-bidi:isolate}
.lst .meta{color:var(--mut);font-size:.85rem;margin-top:2px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap;border:1px solid transparent}
.b-draft{background:#EEE7D8;color:#6a5a40;border-color:#DDCFB2}.b-done{background:var(--okbg);color:var(--ok)}.b-handling{background:var(--warnbg);color:var(--warn)}.b-closed{background:#E4E4EA;color:#4a4a5a}
.b-open{background:var(--badbg);color:var(--bad)}.b-progress{background:var(--warnbg);color:var(--warn)}.b-fixed{background:var(--okbg);color:var(--ok)}
.b-red{background:var(--badbg);color:var(--bad)}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;background:var(--bd);color:#fff;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.5}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--bd2)}
.btn.ghost{background:transparent;color:var(--bd);border:1.5px solid var(--bd)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.9rem}
.btn.block{width:100%}
label.f{display:block;font-size:.85rem;font-weight:700;color:var(--bd2);margin:8px 0 4px}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;min-height:46px}
textarea.in{min-height:70px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.in[readonly],.in:disabled{background:#F6F1E6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:.88rem;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--bd);color:#fff;border-color:var(--bd)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
/* editor */
.ahead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;border-top:4px solid var(--bd)}
.ahead .numbig{font-family:"Frank Ruhl Libre",serif;font-size:1.4rem;font-weight:900;color:var(--bd);direction:ltr;unicode-bidi:isolate}
.prog{height:8px;background:var(--cream2);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--bd));width:0;transition:width .3s}
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.acc>.ah{display:flex;align-items:center;gap:8px;padding:14px;cursor:pointer;font-weight:800;color:var(--bd2);font-size:1.05rem;min-height:56px}
.acc>.ah .cnt{margin-inline-start:auto;font-size:.82rem;color:var(--mut);font-weight:700;white-space:nowrap}
.acc>.ah .chev{transition:transform .2s;color:var(--gold)}
.acc.open>.ah .chev{transform:rotate(-90deg)}
.acc>.ab{display:none;padding:0 10px 12px;border-top:1px solid var(--line)}
.acc.open>.ab{display:block}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:#fff;border-inline-start:5px solid var(--line)}
.item.v-good{border-inline-start-color:var(--ok)}.item.v-bad{border-inline-start-color:var(--bad);background:#FFF9F8}.item.v-nc,.item.v-na{border-inline-start-color:#B9B2A6}
.it-t{font-weight:700;margin-bottom:8px}
.seg{display:flex;gap:6px;margin-bottom:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font-weight:700;min-height:46px;cursor:pointer}
.seg.sm button{min-height:38px;padding:6px;font-size:.85rem;color:var(--mut);font-weight:500}
.seg.xs button{min-height:36px;padding:4px 10px;flex:none;min-width:64px}
.seg button.on.good{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.on.gray{background:#6f6a62;border-color:#6f6a62;color:#fff}
.seg button.on.yes{background:var(--bd);border-color:var(--bd);color:#fff}
.seg button:disabled{cursor:default}
.prev{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--badbg);border-radius:10px;padding:6px 8px;margin:4px 0 6px;font-size:.9rem;font-weight:700;color:#7a1a14}
.prev .seg{margin:0}
.link{background:none;border:0;color:var(--bd);font-weight:700;padding:6px 0;cursor:pointer;font-size:.9rem}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.photos .ph{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .x{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:1}
.actbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,253,248,.97);border-top:2px solid var(--gold);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:30;backdrop-filter:blur(6px)}
.actbar .btn{flex:1}
.pill{font-size:.78rem;font-weight:700;border-radius:99px;padding:3px 10px;background:#EEE7D8;color:#6a5a40}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bd2);border-top:2px solid var(--gold);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;white-space:nowrap;color:#e9d9b4;text-decoration:none;font-size:.7rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px}
.nav a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 0 3px 0 var(--gold2)}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(30,8,14,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.mdl{background:var(--cream);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:4px solid var(--gold)}
.mdl h3{color:var(--bd);font-size:1.25rem;margin-bottom:8px}
.mdl .acts{display:flex;gap:8px;margin-top:14px}.mdl .acts .btn{flex:1}
@media(min-width:700px){.mbg{align-items:center}.mdl{border-radius:18px}}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--bd2);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);border:1px solid var(--gold);max-width:90vw;text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;background:var(--card)}
table.t th{background:var(--bd);color:#fff;padding:8px 6px;font-weight:700}
table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
table.t td:first-child{text-align:right;font-weight:700}
.hist{font-size:.82rem;color:var(--mut);border-inline-start:2px solid var(--gold);padding-inline-start:8px;margin-top:6px}
.hist div{margin:3px 0}
.small{font-size:.85rem;color:var(--mut)}
.ltr{direction:ltr;unicode-bidi:isolate}
@media(max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.ttl h1{font-size:1.1rem}}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-row" id="hdr"></div></header>
<main id="main"></main>
<nav class="nav" id="nav"></nav>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>
<div id="pdfStage" aria-hidden="true"></div>
<script>
"use strict";
/* ============ שאלון הביקורת ============ */

async function init(){
  window.addEventListener('hashchange',route);
  window.addEventListener('online',()=>{S.online=true;updPill();if(S.cur&&S.cur.dirty)saveCur();if(S.auth==='in')loadAll(true)});
  window.addEventListener('offline',()=>{S.online=false;updPill()});
  if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
  if(!sb){S.auth='nocfg';showAuth();return}
  sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){S.auth='recover';showAuth()}else if(ev==='SIGNED_OUT'&&S.auth==='in'){location.hash='';location.reload()}});
  let session=null;
  try{session=(await sb.auth.getSession()).data.session}catch(e){}
  if(S.auth==='recover')return;
  if(!session){S.auth='out';showAuth();return}
  await afterLogin(session.user);
}
async function afterLogin(u){
  S.uid=u.id;S.email=u.email||'';
  const {data:p,error}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
  if(error&&dbErr(error).code==='unavailable'){S.auth='offline';showAuth();return}
  if(!p||!p.active){S.profile=p||null;S.auth='pending';showAuth();return}
  S.profile=p;S.admin=!!(p.is_admin&&p.active);S.profiles[p.id]=p;S.auth='in';
  document.body.classList.remove('authmode');
  route();
  await loadAll();
  subscribeRealtime();
  setInterval(()=>{if(document.visibilityState==='visible')loadAll(true)},60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadAll(true)});
}
const rowToAudit=r=>Object.assign({},r.data,{id:r.id,_owner:r.owner});
const rowToDefect=r=>Object.assign({},r.data,{id:r.id,status:r.status||(r.data&&r.data.status)});
let loading=false;
async function loadAll(quiet){
  if(loading)return;loading=true;
  const timer=setTimeout(()=>{S.slow=true;render()},10000);
  try{
    const [pr,au,de]=await Promise.all([
      sb.from('profiles').select('*'),
      sb.from('audits').select('id,owner,data').order('created_at',{ascending:false}).limit(2000),
      sb.from('defects').select('id,status,data').limit(5000)]);
    const err=pr.error||au.error||de.error;if(err)throw err;
    S.profiles=Object.fromEntries(pr.data.map(x=>[x.id,x]));
    const me=S.profiles[S.uid];
    if(me){S.profile=me;S.admin=!!(me.is_admin&&me.active);if(!me.active){location.reload();return}}
    S.audits.all=au.data.map(rowToAudit);
    S.defects=de.data.map(rowToDefect);
    S.loaded=true;S.slow=false;S.err=null;
    if(S.admin){let pr2;try{pr2=await sb.rpc('pending_requests')}catch(e){pr2={error:e}}pendErr=pr2.error?errText(pr2.error):null;pending=mergePending(pr2.error?[]:(pr2.data||[]));S.pendingCount=pending.filter(x=>!x.rejected).length}
  }catch(e){S.err=dbErr(e).code;S.loaded=true;if(!quiet)toast('טעינת הנתונים נכשלה – בדוק חיבור לאינטרנט')}
  clearTimeout(timer);loading=false;render();
}
let rtTimer=null;
function queueReload(){clearTimeout(rtTimer);rtTimer=setTimeout(()=>loadAll(true),500)}
function subscribeRealtime(){
  try{sb.channel('rab96-db')
    .on('postgres_changes',{event:'*',schema:'public',table:'audits'},queueReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'defects'},queueReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},queueReload)
    .subscribe()}catch(e){}
}

function authMsg(e){const m=String(e&&e.message||e||'');if(/Invalid login/i.test(m))return'דוא״ל או סיסמה שגויים. אם עדיין אין לך חשבון – בחר "בקשת הצטרפות".';if(/already registered|already been registered/i.test(m))return'כתובת זו כבר רשומה – עבור ל"כניסה"';if(/Password should be|at least/i.test(m))return'הסיסמה קצרה מדי (לפחות 8 תווים)';if(/Email not confirmed/i.test(m))return'יש לאשר את כתובת הדוא״ל דרך המייל שנשלח';if(/rate limit/i.test(m))return'יותר מדי ניסיונות – נסה שוב בעוד כמה דקות';if(/fetch|network/i.test(m))return'אין חיבור לשרת – בדוק אינטרנט';return'הפעולה נכשלה: '+m}

/* ============ תמונות מאוחסנות (קישורים זמניים מאובטחים) ============ */
const urlCache={};
async function signedUrls(paths){
  const need=[...new Set(paths.filter(p=>p&&p.includes('/')&&!(urlCache[p]&&urlCache[p].exp>Date.now())))];
  if(need.length&&sb){try{const {data}=await sb.storage.from(BUCKET).createSignedUrls(need,3600);(data||[]).forEach(x=>{const u=x.signedUrl||x.signedURL;if(u&&x.path)urlCache[x.path]={url:u,exp:Date.now()+3500e3}})}catch(e){}}
  return paths.map(p=>urlCache[p]?urlCache[p].url:null);
}
async function hydrate(root){
  const imgs=[...(root||document).querySelectorAll('img[data-ph]')];if(!imgs.length)return;
  const urls=await signedUrls(imgs.map(i=>i.dataset.ph));
  imgs.forEach((im,i)=>{if(urls[i]){im.src=urls[i];im.removeAttribute('data-ph')}else{im.alt='התמונה לא זמינה'}});
}

    c.dirty=false;c.isNew=false;S.save.state='saved';
    {const a=rowToAudit(row),i=S.audits.all.findIndex(x=>x.id===a.id);if(i>=0)S.audits.all[i]=a;else S.audits.all.push(a)}

}

async function compress(file,max=1280){
  const url=URL.createObjectURL(file);const img=new Image();
  await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});
  const sc=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');

  return await new Promise(r=>cv.toBlob(r,'image/jpeg',.75));
}

/* בקשות ממתינות: מה שמחזירה הפונקציה pending_requests, ובנוסף כל פרופיל לא פעיל שטרם הוחלט עליו

function mergePending(list){
  const out=list.slice(),ids=new Set(out.map(x=>x.id));
  Object.values(S.profiles).forEach(p=>{if(p&&!p.active&&!p.decided_at&&p.id!==S.uid&&!ids.has(p.id))out.push({id:p.id,email:p.email||'',full_name:p.full_name||'',rejected:!!p.rejected,requested_at:p.requested_at||p.created_at||'',email_confirmed:null,fromProfiles:true})});
  return out.filter(x=>!(S.profiles[x.id]&&S.profiles[x.id].active));
}
async function loadAdminData(){

  pendErr=pr.error?errText(pr.error):null;
  pending=mergePending(pr.error?[]:(pr.data||[]));logRows=(lg&&lg.data)||[];usersLoaded=true;S.pendingCount=pending.filter(x=>!x.rejected).length;

const LOGTXT={'audits:insert':'ביקורת נוצרה','audits:update':'ביקורת עודכנה','audits:delete':'ביקורת נמחקה','defects:insert':'ליקוי נפתח','defects:update':'ליקוי עודכן','defects:delete':'ליקוי נמחק','profiles:update':'פרטי משתמש עודכנו','profiles:delete':'משתמש נמחק','profile:bootstrap_admin':'מנהל המערכת הראשון נרשם','profile:invite_claimed':'משתמש הפעיל הזמנה','profile:join_approved':'בקשת הצטרפות אושרה','profile:join_rejected':'בקשת הצטרפות נדחתה','profile:promoted_to_admin_via_sql':'מנהל הוגדר מלוח הבקרה'};
async function downloadBackup(){
  toast('מכין גיבוי…');
  const [a,d,p]=await Promise.all([sb.from('audits').select('*'),sb.from('defects').select('*'),sb.from('profiles').select('*')]);
  if(a.error||d.error||p.error){toast('הגיבוי נכשל');return}
  const data={format:'rab96-backup',version:1,exported_at:nowISO(),audits:a.data,defects:d.data,profiles:p.data};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  deliverFile(blob,`גיבוי ביקורות רבנות ${fmtD(nowISO()).replace(/\./g,'-')}.json`,'application/json','הגיבוי מוכן ✓');
}
async function restoreBackup(file){
  if(!file)return;let j;try{j=JSON.parse(await file.text())}catch(e){toast('הקובץ אינו גיבוי תקין');return}
  if(!j||j.format!=='rab96-backup'){toast('הקובץ אינו גיבוי של המערכת');return}
  const A=j.audits||[],D=j.defects||[];
  if(!await ask('שחזור מגיבוי',`<p>בקובץ: <b>${A.length}</b> ביקורות ו־<b>${D.length}</b> ליקויים.</p><p class="small">רשומות קיימות עם אותו מספר יעודכנו לפי הגיבוי. רשומות אחרות לא יימחקו.</p>`,'שחזור'))return;
  let okA=0,okD=0;
  for(const r of A){const owner=S.profiles[r.owner]?r.owner:S.uid;const data=Object.assign({},r.data);if(owner!==r.owner&&!data.inspectorLabel)data.inspectorLabel=r.ownerLabel||'מבקר מגיבוי';
    const x=await sb.from('audits').upsert({id:r.id,owner,unit:r.unit||data.unit||'',status:r.status||data.status,data});if(!x.error)okA++}
  for(const r of D){const x=await sb.from('defects').upsert({id:r.id,audit_id:r.audit_id||(r.data&&r.data.auditNumber),unit:r.unit||(r.data&&r.data.unit)||'',status:r.status||(r.data&&r.data.status)||'open',data:r.data});if(!x.error)okD++}
  toast(`שוחזרו ${okA} ביקורות ו־${okD} ליקויים ✓`,3500);loadAll(true);
}
function deliverFile(blob,filename,type,title){
  const file=new File([blob],filename,{type});window.__lastFile={filename,size:blob.size};
  let canShare=false;try{canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
  const url=URL.createObjectURL(blob);
  const m=modal(`<h3>${esc(title)}</h3><p class="small">${esc(filename)} · ${(blob.size/1048576).toFixed(1)} MB</p><div class="acts" style="flex-direction:column">
    ${canShare?'<button class="btn" data-p="share">📤 שיתוף (וואטסאפ, מייל…)</button>':''}
    <a class="btn gold" style="text-align:center;text-decoration:none" href="${url}" download="${esc(filename)}" data-p="dl">⬇️ הורדה לטלפון</a>
    ${type==='application/pdf'?`<a class="btn ghost" style="text-align:center;text-decoration:none" href="${url}" target="_blank" rel="noopener">👁️ פתיחה לצפייה</a>`:''}
    <button class="btn ghost" data-p="x">סגירה</button></div>`);
  m.addEventListener('click',async e=>{const b=e.target.closest('[data-p]');if(!b)return;
    if(b.dataset.p==='share'){try{await navigator.share({files:[file],title:filename})}catch(err){}}
    else if(b.dataset.p==='x')m.remove()});
}

    B.push(`<div class="rp-def"><span class="n">${esc(it.key)}</span> · <b>${esc(it.secT)} – ${esc(it.t)}</b>${df?` · <span class="rp-st">${esc(DSTAT[df.status]||'')}</span>`:''}<div class="rp-meta">${esc(a.note||TY[it.ty].b)}${a.prev?` · דווח בעבר: ${a.prev==='yes'?'כן':'לא'}`:''}${df&&df.responsible?` · אחראי: ${esc(df.responsible)}`:''}${df&&df.targetDate?` · יעד: ${fmtD(df.targetDate)}`:''}</div></div>`)});
  B.push(`<div class="rp-sec">סיכום הביקורת</div><div class="rp-box"><div class="k">נקודות שימור ופירגון</div>${esc(sm.keep||'—')}</div>`);
  B.push(`<div class="rp-box"><div class="k">נקודות שיפור ומעקב</div>${esc(sm.improve||'—')}</div>`);
  B.push(`<div class="rp-box"><div class="k">יעדים ומטרות</div>${esc(sm.goals||'—')}</div>`);
  B.push(`<div class="rp-box"><div class="k">העתק הדוח ל:</div>${esc(sm.cc||'—')}</div>`);
  const sigImg=d.signature?`<div class="rp-imgbox sig" data-pj="${pjAdd(d.signature)}"></div>`:'';
  B.push(`<div class="rp-sig"><div>שם המבקר: ${esc(inspName(d,owner))}<br/>${esc(roleOf(owner))}</div><div>${sigImg}חתימה</div><div>תאריך: ${fmtD(d.createdAt)}</div></div>`);
  return B;
}}
async function auditPdf(){
  const c=S.cur;if(!c)return;
  if(c.editable&&c.dirty)await saveCur();
  makePdf(auditBlocks(c.data,c.owner),`ביקורת ${c.data.number}`,`דוח ביקורת ${c.data.number}.pdf`);
}
function unitDefectsPdf(){
  const unit=$('#repUnit')&&$('#repUnit').value;if(!unit){toast('בחר יחידה');return}
  const inc=$('#repAll')&&$('#repAll').checked;
  makePdf(async()=>{
    const emb=await embData();
    let D=S.defects.filter(d=>d.unit===unit);if(!inc)D=D.filter(d=>d.status==='open'||d.status==='progress');
    D.sort((a,b)=>String(a.discoveredAt).localeCompare(String(b.discoveredAt)));
    const c=k=>S.defects.filter(d=>d.unit===unit&&d.status===k).length;
    const B=[`<div class="rp-head"><img src="${emb}"/><div class="rp-h1">דוח ליקויים מרוכז</div><div class="rp-h2">${esc(unit)}</div><div class="rp-sl">רבנות פקמ״ז · הופק ${fmtD(nowISO())}${inc?' · כל הליקויים':' · ליקויים פתוחים ובטיפול'}</div></div>
     <div class="rp-stats"><div class="rp-stat"><b style="color:#B3261E">${c('open')}</b>פתוחים</div><div class="rp-stat"><b style="color:#9A6B00">${c('progress')}</b>בטיפול</div><div class="rp-stat"><b style="color:#2F7A4B">${c('fixed')}</b>תוקנו</div><div class="rp-stat"><b>${c('closed')}</b>נסגרו</div></div>`];
    if(!D.length)B.push('<div class="rp-box">אין ליקויים להצגה.</div>');
    for(const d of D){
      const au=allAudits().find(a=>a.number===d.auditNumber);const ph=au&&au.answers&&au.answers[d.itemKey]&&au.answers[d.itemKey].photos;
      const pb=(ph&&ph.length)?photoBlocks(ph,`${d.itemKey} ${d.item||''}`):[];
      B.push(`<div class="rp-def"><span class="n">${esc(d.number)}</span> · <b>${esc(d.section)} – ${esc(d.item)}</b> · <span class="rp-st">${esc(DSTAT[d.status]||'')}</span>
       <div>${esc(d.description)}</div>
       <div class="rp-meta">מיקום: ${esc(d.location||'—')} · נתגלה: ${fmtD(d.discoveredAt)} · מבקר: ${esc(d.inspectorLabel||nameOf(d.inspector))} · דווח בעבר: ${d.reportedBefore==='yes'?'כן':d.reportedBefore==='no'?'לא':'—'}</div>
       <div class="rp-meta">אחראי: ${esc(d.responsible||'טרם נקבע')} · יעד: ${d.targetDate?fmtD(d.targetDate):'—'}${d.closedAt?` · נסגר: ${fmtD(d.closedAt)}`:''}${d.fixNotes?` · תיעוד: ${esc(d.fixNotes)}`:''}</div></div>`+(pb.shift()||''));
      B.push(...pb);
    }
    return B;
  },`ליקויים – ${unit}`,`דוח ליקויים ${unit.replace(/[\\/:*?"<>|]/g,'')}.pdf`);
}

init();
