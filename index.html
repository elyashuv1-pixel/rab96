<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4B0C1A">
<title>מערכת ביקורות הרבנות | רבנות אוגמ״ר 96</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
<meta name="apple-mobile-web-app-title" content="ביקורות הרבנות">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bd:#6E1528;--bd2:#4B0C1A;--bd3:#8E2238;--gold:#C9A227;--gold2:#E8CD6E;--cream:#F7F1E4;--cream2:#EFE5CF;--ink:#2A1A1D;--mut:#7A6A66;--ok:#2F7A4B;--okbg:#E5F2E9;--bad:#B3261E;--badbg:#FBE7E5;--warn:#9A6B00;--warnbg:#FFF3D6;--line:#E3D6BB;--card:#FFFDF8;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Heebo,Arial,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"Frank Ruhl Libre",serif;margin:0}
.hdr{background:linear-gradient(160deg,var(--bd2),var(--bd) 55%,var(--bd3));color:#fff;padding:14px 16px 12px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(60,10,20,.25)}
.hdr-row{display:flex;align-items:center;gap:12px;max-width:900px;margin:0 auto}
.emb{width:48px;height:48px;flex:none;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.hdr.home{padding:8px 16px}
.hdr.home .me{max-width:100%;text-align:right;margin:0;display:flex;gap:8px;align-items:baseline}
.hdr .back{margin-inline-start:auto}
.hero{text-align:center;padding:6px 0 2px}
.hero img{width:132px;height:auto;object-fit:contain;display:block;margin:4px auto 8px;filter:drop-shadow(0 3px 6px rgba(75,12,26,.25))}
.hero h1{font-size:1.75rem;font-weight:900;color:var(--bd2);line-height:1.2}
.hero .sub{font-family:"Frank Ruhl Libre",serif;color:var(--gold);font-weight:900;font-size:1.25rem;margin-top:2px;text-shadow:0 1px 0 rgba(75,12,26,.15)}
.phbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--gold);background:#FFFBEF;color:var(--bd);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.9rem;margin-top:8px;cursor:pointer;min-height:42px}
.phbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.photos .ph{cursor:zoom-in}
.photos .cnt{font-size:.75rem;color:var(--mut)}
body.authmode .nav{display:none}
.authbox{max-width:440px;margin:6px auto;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:16px;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}
.logout{background:rgba(255,255,255,.12);border:1px solid rgba(232,205,110,.5);color:#fff;border-radius:9px;padding:4px 10px;font-weight:700;font-size:.8rem;margin-inline-start:auto}
.sig{width:100%;height:150px;background:#fff;border:1.5px dashed var(--gold);border-radius:10px;touch-action:none;display:block}
.sigimg{max-width:100%;height:110px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
#pdfStage{position:fixed;left:-20000px;top:0;width:794px;pointer-events:none}
.ttl h1{font-size:1.3rem;font-weight:900;letter-spacing:.3px;color:#fff}
.ttl .sub{color:var(--gold2);font-weight:700;font-size:.95rem}
.hdr .me{margin-inline-start:auto;text-align:left;font-size:.8rem;color:#f3e6c8;max-width:40%}
.hdr .me b{display:block;color:#fff;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .back{background:rgba(255,255,255,.12);border:1px solid rgba(232,205,110,.5);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
main{max-width:900px;margin:0 auto;padding:14px 14px 110px}
.slogan{text-align:center;font-family:"Frank Ruhl Libre",serif;color:var(--bd);font-weight:700;font-size:1.1rem;margin:4px 0 14px;display:flex;align-items:center;gap:10px;justify-content:center}
.slogan:before,.slogan:after{content:"";height:1px;flex:1;max-width:70px;background:linear-gradient(90deg,transparent,var(--gold))}
.slogan:after{background:linear-gradient(270deg,transparent,var(--gold))}
.banner{border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.92rem;border:1px solid}
.banner.info{background:#F2ECDD;border-color:var(--line);color:#5a4a3c}
.banner.warn{background:var(--warnbg);border-color:#EBCB7A;color:#6b4a00}
.banner.bad{background:var(--badbg);border-color:#EBB0AA;color:#7a1a14}
.banner .btn{margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat .n{font-family:"Frank Ruhl Libre",serif;font-size:1.7rem;font-weight:900;color:var(--bd);line-height:1.1}
.stat .l{font-size:.75rem;color:var(--mut);font-weight:500}
.stat.r .n{color:var(--bad)}.stat.g .n{color:var(--ok)}.stat.y .n{color:var(--warn)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:16px;padding:18px 12px;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:1.05rem;color:var(--bd2);box-shadow:0 2px 0 rgba(110,21,40,.06);cursor:pointer}
.tile:active{transform:scale(.98)}
.tile .ic{width:54px;height:54px;border-radius:50%;background:var(--bd);display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--gold)}
.tile .ic svg{width:28px;height:28px;stroke:var(--gold2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile.main{grid-column:1/-1;background:linear-gradient(160deg,var(--bd),var(--bd3));color:#fff;border-top-color:var(--gold2);min-height:96px;flex-direction:row;font-size:1.2rem}
.tile.main .ic{background:rgba(0,0,0,.2)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.sec-h h2{font-size:1.15rem;color:var(--bd)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.lst .card{cursor:pointer;display:block}
.lst .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lst .num{font-weight:800;color:var(--bd);direction:ltr;unicode-bidi:isolate}
.lst .meta{color:var(--mut);font-size:.85rem;margin-top:2px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap;border:1px solid transparent}
.b-draft{background:#EEE7D8;color:#6a5a40;border-color:#DDCFB2}.b-done{background:var(--okbg);color:var(--ok)}.b-handling{background:var(--warnbg);color:var(--warn)}.b-closed{background:#E4E4EA;color:#4a4a5a}
.b-open{background:var(--badbg);color:var(--bad)}.b-progress{background:var(--warnbg);color:var(--warn)}.b-fixed{background:var(--okbg);color:var(--ok)}
.b-red{background:var(--badbg);color:var(--bad)}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;background:var(--bd);color:#fff;cursor:pointer;min-height:48px}
.btn:disabled{opacity:.5}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--bd2)}
.btn.ghost{background:transparent;color:var(--bd);border:1.5px solid var(--bd)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.9rem}
.btn.block{width:100%}
label.f{display:block;font-size:.85rem;font-weight:700;color:var(--bd2);margin:8px 0 4px}
input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;min-height:46px}
textarea.in{min-height:70px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.in[readonly],.in:disabled{background:#F6F1E6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:.88rem;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--bd);color:#fff;border-color:var(--bd)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
/* editor */
.ahead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;border-top:4px solid var(--bd)}
.ahead .numbig{font-family:"Frank Ruhl Libre",serif;font-size:1.4rem;font-weight:900;color:var(--bd);direction:ltr;unicode-bidi:isolate}
.prog{height:8px;background:var(--cream2);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--bd));width:0;transition:width .3s}
.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.acc>.ah{display:flex;align-items:center;gap:8px;padding:14px;cursor:pointer;font-weight:800;color:var(--bd2);font-size:1.05rem;min-height:56px}
.acc>.ah .cnt{margin-inline-start:auto;font-size:.82rem;color:var(--mut);font-weight:700;white-space:nowrap}
.acc>.ah .chev{transition:transform .2s;color:var(--gold)}
.acc.open>.ah .chev{transform:rotate(-90deg)}
.acc>.ab{display:none;padding:0 10px 12px;border-top:1px solid var(--line)}
.acc.open>.ab{display:block}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:#fff;border-inline-start:5px solid var(--line)}
.item.v-good{border-inline-start-color:var(--ok)}.item.v-bad{border-inline-start-color:var(--bad);background:#FFF9F8}.item.v-nc,.item.v-na{border-inline-start-color:#B9B2A6}
.it-t{font-weight:700;margin-bottom:8px}
.seg{display:flex;gap:6px;margin-bottom:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font-weight:700;min-height:46px;cursor:pointer}
.seg.sm button{min-height:38px;padding:6px;font-size:.85rem;color:var(--mut);font-weight:500}
.seg.xs button{min-height:36px;padding:4px 10px;flex:none;min-width:64px}
.seg button.on.good{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.on.gray{background:#6f6a62;border-color:#6f6a62;color:#fff}
.seg button.on.yes{background:var(--bd);border-color:var(--bd);color:#fff}
.seg button:disabled{cursor:default}
.prev{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--badbg);border-radius:10px;padding:6px 8px;margin:4px 0 6px;font-size:.9rem;font-weight:700;color:#7a1a14}
.prev .seg{margin:0}
.link{background:none;border:0;color:var(--bd);font-weight:700;padding:6px 0;cursor:pointer;font-size:.9rem}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.photos .ph{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .x{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:1}
.actbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,253,248,.97);border-top:2px solid var(--gold);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:30;backdrop-filter:blur(6px)}
.actbar .btn{flex:1}
.pill{font-size:.78rem;font-weight:700;border-radius:99px;padding:3px 10px;background:#EEE7D8;color:#6a5a40}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bd2);border-top:2px solid var(--gold);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav a{flex:1;white-space:nowrap;color:#e9d9b4;text-decoration:none;font-size:.7rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px}
.nav a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 0 3px 0 var(--gold2)}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(30,8,14,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.mdl{background:var(--cream);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:4px solid var(--gold)}
.mdl h3{color:var(--bd);font-size:1.25rem;margin-bottom:8px}
.mdl .acts{display:flex;gap:8px;margin-top:14px}.mdl .acts .btn{flex:1}
@media(min-width:700px){.mbg{align-items:center}.mdl{border-radius:18px}}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--bd2);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);border:1px solid var(--gold);max-width:90vw;text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;background:var(--card)}
table.t th{background:var(--bd);color:#fff;padding:8px 6px;font-weight:700}
table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
table.t td:first-child{text-align:right;font-weight:700}
.hist{font-size:.82rem;color:var(--mut);border-inline-start:2px solid var(--gold);padding-inline-start:8px;margin-top:6px}
.hist div{margin:3px 0}
.small{font-size:.85rem;color:var(--mut)}
.ltr{direction:ltr;unicode-bidi:isolate}
@media(max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.ttl h1{font-size:1.1rem}}
.tiles.cats{grid-template-columns:repeat(3,1fr);margin-bottom:14px}
.tile.cat{min-height:96px;font-size:1rem;gap:6px}.tile.cat .cic{font-size:2rem;line-height:1}
.cathd{font-weight:900;color:var(--bd2);font-size:1.15rem;margin-bottom:4px}
.catlbl{font-size:.82rem;color:var(--gold);font-weight:800}
@media(max-width:380px){.tiles.cats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-row" id="hdr"></div></header>
<main id="main"></main>
<nav class="nav" id="nav"></nav>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>
<div id="pdfStage" aria-hidden="true"></div>
<script>
"use strict";
/* ============ שאלון הביקורת ============ */
const TY={ok:{g:'תקין',b:'לא תקין'},ex:{g:'קיים',b:'לא קיים'},has:{g:'יש',b:'אין'},breach:{g:'אין פרצות',b:'יש פרצות'},mix:{g:'אין ערבוב',b:'יש ערבוב'},done:{g:'בוצע',b:'לא בוצע'}};

/* ============ שש הביקורות של אוגמ״ר 96 ============ */
/* כל ביקורת: רשימת פרקים, ובכל פרק סעיפים [שאלה, סוג תשובה]. מפתחות הסעיפים ייחודיים לכל המערכת (לצורך מעקב ליקויים). */
const FRIDGE_ITEMS=[['ניקיון המקרר','ok'],['סימון ושילוט המקרר לפי ייעוד','ex'],['הפרדה בין מוצרים – ללא ערבוב','mix'],['מוצרים בהכשר תקין','ok'],['מוצרים בתוקף','ok'],['מוצרים סגורים ומכוסים','ok'],['טמפרטורה תקינה','ok']];
const KITCH_ITEMS=[['ניקיון המטבחון','ok'],['נוהל מטבחון תלוי ומעודכן','ex'],['דרכי התקשרות לרבנות','ex'],['כלים מסומנים (בשרי / חלבי / פרווה)','ok'],['ערבובי כלים','mix'],['מכשירי חשמל מסומנים','ok'],['מקרר מאופיין ומסודר','ok'],['מוצרים בהכשר תקין','ok'],['מוצרים בתוקף','ok'],['ספוגים ומטליות מסומנים','ok']];
const WASH_ITEMS=[['ניקיון חדר השטיפה','ok'],['הפרדת כיורים / עמדות שטיפה','ok'],['שילוט כיורים ועמדות','ex'],['ספוגים ומטליות מסומנים','ok'],['ערבובי כלים בשטיפה','mix'],['ייבוש ואחסון כלים לפי ייעוד','ok'],['השטיפה בוצעה כנדרש','done']];
const CATS=[
 {id:'fridge',t:'מקררים',ic:'❄️',p:'FR',secs:[
   {id:'veg',t:'מקרר ירקות',items:[...FRIDGE_ITEMS,['ירקות שטופים ובדוקים מחרקים','ok'],['תיעוד בדיקת ירקות','ex']]},
   {id:'milk',t:'מקרר חלבי',items:FRIDGE_ITEMS},
   {id:'meat',t:'מקפיא בשרי',items:[...FRIDGE_ITEMS.filter(x=>x[0]!=='טמפרטורה תקינה'),['טמפרטורת הקפאה תקינה','ok'],['בשר באריזה סגורה ומסומנת','ok']]}]},
 {id:'kitchen',t:'מטבחונים',ic:'☕',p:'KT',secs:[
   {id:'med',t:'מטבחון רפואה',items:KITCH_ITEMS},{id:'agam',t:'מטבחון אג״ם',items:KITCH_ITEMS},
   {id:'maog',t:'מטבחון לשכת מאו״ג',items:KITCH_ITEMS},{id:'intel',t:'מטבחון מודיעין',items:KITCH_ITEMS},
   {id:'tikshuv',t:'מטבחון תקשוב',items:KITCH_ITEMS},{id:'samba',t:'מטבחון סמבציות',items:KITCH_ITEMS}]},
 {id:'wash',t:'חדרי שטיפה',ic:'🚿',p:'WS',secs:[
   {id:'am',t:'שטיפת בוקר',items:WASH_ITEMS},{id:'noon',t:'שטיפת צהריים',items:WASH_ITEMS},{id:'pm',t:'שטיפת ערב',items:WASH_ITEMS}]},
 {id:'shul',t:'בית כנסת',ic:'🕍',p:'BK',secs:[
   {id:'shul',t:'בית כנסת',items:[['ניקיון','ok'],['סדר','ok'],['דרכי התקשרות','ex'],['לוח רבנות – קיום','ex'],['לוח רבנות – תקינות','ok'],['תפילין','ok'],['טליתות','ok'],['ספר תורה צה״לי','ok'],['מודים דרבנן','ok'],['בריך שמיא','ok'],['תורת המחנה – ארבעה חלקים','ex']]}]},
 {id:'mach',t:'חדר מכ״ש',ic:'🧽',p:'MK',secs:[
   {id:'daily',t:'ניקיון יומי',items:[['ניקיון יומי בוצע','done'],['רצפה ומשטחים נקיים','ok'],['פינוי פסולת','done']]},
   {id:'twice',t:'שטיפה פעמיים בשבוע',items:[['שטיפה ראשונה בשבוע','done'],['שטיפה שנייה בשבוע','done'],['תיעוד ביצוע השטיפות','ex']]},

const urlCache={};
async function signedUrls(paths){
  const need=[...new Set(paths.filter(p=>p&&p.includes('/')&&!(urlCache[p]&&urlCache[p].exp>Date.now())))];
  if(need.length&&sb){try{const {data}=await sb.storage.from(BUCKET).createSignedUrls(need,3600);(data||[]).forEach(x=>{const u=x.signedUrl||x.signedURL;if(u&&x.path)urlCache[x.path]={url:u,exp:Date.now()+3500e3}})}catch(e){}}
  return paths.map(p=>urlCache[p]?urlCache[p].url:null);
}
async function hydrate(root){
  const imgs=[...(root||document).querySelectorAll('img[data-ph]')];if(!imgs.length)return;
  const urls=await signedUrls(imgs.map(i=>i.dataset.ph));
  imgs.forEach((im,i)=>{if(urls[i]){im.src=urls[i];im.removeAttribute('data-ph')}else{im.alt='התמונה לא זמינה'}});
}

async function saveCur(manual){
  const c=S.cur;if(!c||!c.editable)return;
  clearTimeout(saveTimer);
  LS.set('ogmar96:cur',{uid:S.uid,owner:c.owner,data:c.data,synced:false});

  if(saving){saveAgain=true;return}
  saving=true;S.save.state='saving';updPill();
  const d=c.data,h=d.history||(d.history=[]),last=h[h.length-1],n=nowISO();
  if(last&&last.by===S.uid&&last.act==='עודכנה'&&(Date.parse(n)-Date.parse(last.at))<30*60000)last.at=n;
  else if(!c.isNew||h.length>1||manual)h.push({at:n,by:S.uid,act:c.isNew&&h.length===1?'נשמרה לראשונה':'עודכנה'});

  const write=async()=>{let r;try{r=await sb.from('audits').upsert(row).select('id')}catch(e){throw dbErr(e)}if(r.error)throw dbErr(r.error);if(!r.data||!r.data.length)throw{code:'invalid_argument'};};
  try{
    try{await write()}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*700));await write()}else throw e}
    c.dirty=false;c.isNew=false;S.save.state='saved';
    {const a=rowToAudit(row),i=S.audits.all.findIndex(x=>x.id===a.id);if(i>=0)S.audits.all[i]=a;else S.audits.all.push(a)}
    LS.set('ogmar96:cur',{uid:S.uid,owner:c.owner,data:c.data,synced:true});
    if(manual)toast('הביקורת נשמרה ✓');
  }catch(e){
    S.save.state=(e&&e.code==='unavailable')?'local':'error';
    if(e&&e.code==='invalid_argument')toast('השמירה נדחתה – אין הרשאה לערוך ביקורת זו');
    else if(e&&e.code==='quota_exceeded')toast('מסד הנתונים מלא – פנה למנהל המערכת');
    else if(manual)toast('השמירה בשרת לא הצליחה. הנתונים נשמרו במכשיר.');
  }
  saving=false;updPill();
  if(saveAgain){saveAgain=false;saveCur()}
}
async function finishFlow(){

async function ensureDefects(){

      history:[{at:t,by:S.uid,act:'הליקוי נפתח מתוך ביקורת'}],updatedAt:t,updatedBy:S.uid};

async function compress(file,max=1280){
  const url=URL.createObjectURL(file);const img=new Image();
  await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});
  const sc=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');
  cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',.75));
}

async function restoreBackup(file){

  if(!j||j.format!=='ogmar96-backup'){toast('הקובץ אינו גיבוי של המערכת');return}
  const A=j.audits||[],D=j.defects||[];
  if(!await ask('שחזור מגיבוי',`<p>בקובץ: <b>${A.length}</b> ביקורות ו־<b>${D.length}</b> ליקויים.</p><p class="small">רשומות קיימות עם אותו מספר יעודכנו לפי הגיבוי. רשומות אחרות לא יימחקו.</p>`,'שחזור'))return;
  let okA=0,okD=0;
  for(const r of A){const owner=S.profiles[r.owner]?r.owner:S.uid;const data=Object.assign({},r.data);if(owner!==r.owner&&!data.inspectorLabel)data.inspectorLabel=r.ownerLabel||'מבקר מגיבוי';
    const x=await sb.from('audits').upsert({id:r.id,owner,unit:r.unit||data.unit||'',status:r.status||data.status,data});if(!x.error)okA++}
  for(const r of D){const x=await sb.from('defects').upsert({id:r.id,audit_id:r.audit_id||(r.data&&r.data.auditNumber),unit:r.unit||(r.data&&r.data.unit)||'',status:r.status||(r.data&&r.data.status)||'open',data:r.data});if(!x.error)okD++}
  toast(`שוחזרו ${okA} ביקורות ו־${okD} ליקויים ✓`,3500);loadAll(true);
}
function deliverFile(blob,filename,type,title){
  const file=new File([blob],filename,{type});window.__lastFile={filename,size:blob.size};
  let canShare=false;try{canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
  const url=URL.createObjectURL(blob);
  const m=modal(`<h3>${esc(title)}</h3><p class="small">${esc(filename)} · ${(blob.size/1048576).toFixed(1)} MB</p><div class="acts" style="flex-direction:column">
    ${canShare?'<button class="btn" data-p="share">📤 שיתוף (וואטסאפ, מייל…)</button>':''}
    <a class="btn gold" style="text-align:center;text-decoration:none" href="${url}" download="${esc(filename)}" data-p="dl">⬇️ הורדה לטלפון</a>
    ${type==='application/pdf'?`<a class="btn ghost" style="text-align:center;text-decoration:none" href="${url}" target="_blank" rel="noopener">👁️ פתיחה לצפייה</a>`:''}
    <button class="btn ghost" data-p="x">סגירה</button></div>`);
  m.addEventListener('click',async e=>{const b=e.target.closest('[data-p]');if(!b)return;
    if(b.dataset.p==='share'){try{await navigator.share({files:[file],title:filename})}catch(err){}}
    else if(b.dataset.p==='x')m.remove()});
}

function sigHTML(){
  const c=S.cur,d=c.data;
  if(d.signature)return `<img class="sigimg" src="${PH_PH}" data-ph="${esc(d.signature)}" alt="חתימת המבקר"><div class="small">נחתם ${fmtDT(d.signedAt)}</div>${c.editable?'<button class="link" onclick="clearSig()">חתימה מחדש</button>':''}`;
  if(!c.editable)return '<div class="small">טרם נחתם</div>';
  return `<canvas class="sig" id="sigPad"></canvas><div class="row" style="margin-top:6px"><button class="btn sm" onclick="saveSig()">שמירת החתימה</button><button class="btn sm ghost" onclick="padClear()">ניקוי</button><span class="small">חתום באצבע בתוך המסגרת</span></div>`;
}
let padDirty=false;
function initPad(){
  const cv=$('#sigPad');if(!cv||cv.dataset.ok)return;cv.dataset.ok=1;
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
  const cx=cv.getContext('2d');cx.scale(dpr,dpr);cx.lineWidth=2.4;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#1a1a40';
  let down=false;const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.addEventListener('pointerdown',e=>{down=true;padDirty=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);cx.beginPath();cx.moveTo(x,y)});
  cv.addEventListener('pointermove',e=>{if(!down)return;const[x,y]=pt(e);cx.lineTo(x,y);cx.stroke()});
  ['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>down=false));
}
function padClear(){const cv=$('#sigPad');if(!cv)return;cv.getContext('2d').clearRect(0,0,cv.width,cv.height);padDirty=false}
async function saveSig(){
  const cv=$('#sigPad');if(!cv||!padDirty){toast('יש לחתום קודם בתוך המסגרת');return}
  const c=S.cur;const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  const path=`${c.data.number}/signature/${Date.now()}.png`;
  const up=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/png'});
  if(up.error){toast('שמירת החתימה נכשלה');return}
  c.data.signature=path;c.data.signedAt=nowISO();c.data.history.push({at:nowISO(),by:S.uid,act:'המבקר חתם על הדוח'});
  $('#sigBox').innerHTML=sigHTML();hydrate($('#sigBox'));changed();await saveCur();toast('החתימה נשמרה ✓');
}
function clearSig(){const c=S.cur;delete c.data.signature;delete c.data.signedAt;$('#sigBox').innerHTML=sigHTML();changed();initPad()}

function imgToDataUrl(src,max,type){
  return new Promise(res=>{if(!src)return res(null);const im=new Image();if(/^https?:/.test(src))im.crossOrigin='anonymous';im.onload=()=>{try{const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const cv=document.createElement('canvas');cv.width=Math.round(im.naturalWidth*sc);cv.height=Math.round(im.naturalHeight*sc);const cx=cv.getContext('2d');if(type!=='image/png'){cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height)}cx.drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL(type||'image/jpeg',.82))}catch(e){res(null)}};im.onerror=()=>res(null);im.src=src});
}

const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),ms))]);
async function loadPhotoBitmap(path){
  if(!path||!path.includes('/'))throw new Error('נתיב תמונה לא תקין');
  let bucket=BUCKET;if(path.startsWith('sb::')){bucket=SB_BUCKET;path=path.slice(4)}
  let last;
  for(let t=0;t<3;t++){
    try{
      const r=await withTimeout(sb.storage.from(bucket).download(path),30000);
      if(r.error||!r.data)throw new Error((r.error&&r.error.message)||'ההורדה נכשלה');
      if(!r.data.size)throw new Error('קובץ ריק');
      const bmp=await createImageBitmap(r.data);
      if(!bmp.width||!bmp.height)throw new Error('קובץ תמונה פגום');
      return bmp;
    }catch(e){last=e;await new Promise(z=>setTimeout(z,600*(t+1)))}
  }
  throw last||new Error('ההורדה נכשלה');
}
async function preloadPhotos(paths,onProgress){
  const bitmaps=new Array(paths.length),failed=[];let done=0,next=0;
  async function worker(){while(next<paths.length){const i=next++;try{bitmaps[i]=await loadPhotoBitmap(paths[i])}catch(e){failed.push({path:paths[i],reason:String(e&&e.message||e)})}done++;onProgress&&onProgress(done,paths.length)}}
  await Promise.all([worker(),worker(),worker()]);
  return{bitmaps,failed};
}

async function layoutPages(blocks,runLabel){

  const newPage=()=>{const pg=document.createElement('div');pg.className='rp-page';pg.innerHTML=`<div class="rp-run"><img src="${emb}"/><span>מערכת ביקורות הרבנות | רבנות אוגמ״ר 96</span><span class="l">${bidiSafe(runLabel)}</span></div><div class="rp-body"></div><div class="rp-foot"></div>`;stage.appendChild(pg);pages.push(pg);body=pg.querySelector('.rp-body')};
  newPage();

    const tmp=document.createElement('div');tmp.innerHTML=b.html;const els=[...tmp.childNodes];
    els.forEach(e=>body.appendChild(e));
    if(body.scrollHeight>body.clientHeight+1&&body.childNodes.length>els.length){

async function pageToJpeg(pg,bitmaps){
  const xml=new XMLSerializer().serializeToString(pg);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123"><foreignObject x="0" y="0" width="794" height="1123"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="width:794px;height:1123px"><style>${REPORT_CSS}</style>${xml}</div></foreignObject></svg>`;
  const img=new Image();
  await new Promise((r,j)=>{img.onload=r;img.onerror=()=>j(new Error('svg'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
  const SC=2,W=794*SC,H=1123*SC,cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');
  cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.drawImage(img,0,0,W,H);
  await new Promise(r=>setTimeout(r,60));cx.drawImage(img,0,0,W,H);
  // ציור התמונות ישירות על הדף – ביחס המקורי, ללא חיתוך וללא מתיחה
  const pr=pg.getBoundingClientRect();let drawn=0;
  cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
  for(const box of pg.querySelectorAll('.rp-imgbox')){
    const bmp=bitmaps[+box.dataset.pj];if(!bmp)throw new Error('תמונה חסרה בשלב הציור');
    const r=box.getBoundingClientRect(),pad=box.classList.contains('sig')?0:3;
    const bx=(r.left-pr.left+pad)*SC,by=(r.top-pr.top+pad)*SC,bw=(r.width-2*pad)*SC,bh=(r.height-2*pad)*SC;
    const k=Math.min(bw/bmp.width,bh/bmp.height),dw=bmp.width*k,dh=bmp.height*k;
    cx.drawImage(bmp,bx+(bw-dw)/2,by+(bh-dh)/2,dw,dh);drawn++;
  }
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.9));
  return{bytes:new Uint8Array(await blob.arrayBuffer()),w:W,h:H,drawn};
}
function buildPdf(pages,title){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(n,body,stream)=>{offs[n]=len;push(`${n} 0 obj\n${body}\n`);if(stream){push('stream\n');push(stream);push('\nendstream\n')}push('endobj\n')};
  push('%PDF-1.4\n');push(new Uint8Array([37,226,227,207,211,10]));
  const n=pages.length,kids=pages.map((_,i)=>`${3+i*3} 0 R`).join(' ');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`);
  pages.forEach((p,i)=>{const o=3+i*3,cs=enc.encode('q 595.28 0 0 841.89 0 0 cm /Im0 Do Q');
    obj(o,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${o+2} 0 R >> >> /Contents ${o+1} 0 R >>`);
    obj(o+1,`<< /Length ${cs.length} >>`,cs);
    obj(o+2,`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>`,p.bytes)});
  const total=3+n*3,xref=len;
  let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x);push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}
let pdfBusy=false;
async function makePdf(blocksFn,runLabel,filename){
  if(pdfBusy)return;pdfBusy=true;
  const again=()=>makePdf(blocksFn,runLabel,filename);
  try{
    pdfProgress('מכין את תוכן הדוח…');
    PJ={list:[]};
    const blocks=await blocksFn();
    const paths=PJ.list.slice();let bitmaps=[];
    if(paths.length){
      pdfProgress(`טוען תמונות 0 מתוך ${paths.length}…`);
      const res=await preloadPhotos(paths,(d,n)=>pdfProgress(`טוען תמונות ${d} מתוך ${n}…`));
      if(res.failed.length){pdfProgress(null);pdfBusy=false;photoFailModal(res.failed,again);return}
      bitmaps=res.bitmaps;
    }
    pdfProgress('מסדר עמודים…');
    const pages=await layoutPages(blocks,runLabel);const out=[];
    const slots=pages.reduce((n,pg)=>n+pg.querySelectorAll('.rp-imgbox').length,0);
    for(let i=0;i<pages.length;i++){pdfProgress(`מעבד עמוד ${i+1} מתוך ${pages.length}…`);out.push(await pageToJpeg(pages[i],bitmaps))}
    const drawn=out.reduce((n,p)=>n+p.drawn,0);
    $('#pdfStage').innerHTML='';bitmaps.forEach(b=>{try{b&&b.close&&b.close()}catch(e){}});
    if(drawn!==slots)throw new Error(`שולבו ${drawn} מתוך ${slots} תמונות`);
    const blob=buildPdf(out);
    pdfProgress(null);
    window.__lastPdf=blob;window.__lastPdfPhotos={expected:slots,drawn,unique:paths.length};
    deliverFile(blob,filename,'application/pdf',paths.length?`הדוח מוכן ✓ (${drawn} תמונות שולבו בקובץ)`:'הדוח מוכן ✓');
  }catch(e){pdfProgress(null);toast('הפקת הדוח נכשלה: '+(e&&e.message||''),4500)}
  finally{pdfBusy=false;pdfProgress(null);PJ=null}
}

const SB_ST={done:'תודרך',not:'לא תודרך',na:'לא רלוונטי'};

const SB_DECL='הריני מאשר כי העברתי את תדריך השבת, הנושאים המסומנים נידונו במסגרת התדריך, והמשתתפים הרשומים אישרו את השתתפותם בחתימתם.';
const SB={list:[],loaded:false,loading:false,err:'',tpl:null,cur:null,parts:[],step:0,dirty:false,saving:false,timer:null,saveState:'saved',leaving:false,arcSt:'all',tplWork:null};

const sbItems=b=>{const out=[];(b&&b.items||[]).forEach(c=>(c.items||[]).forEach(it=>{if(it.active!==false)out.push(Object.assign({cat:c.title,catId:c.id},it))}));return out};
const sbAns=(b,id)=>(b.answers||{})[id]||{};
const sbAnswered=b=>sbItems(b).filter(it=>{const a=sbAns(b,it.id);return a.s==='done'||((a.s==='not'||a.s==='na')&&(a.reason||'').trim())}).length;
const sbGaps=b=>sbItems(b).filter(it=>sbAns(b,it.id).s==='not');
const sbNA=b=>sbItems(b).filter(it=>sbAns(b,it.id).s==='na');
const sbPresenter=b=>`${b.presenter_rank?b.presenter_rank+' ':''}${b.presenter_first||''} ${b.presenter_last||''}`.trim()||'—';
const sbMaskPN=pn=>{const d=String(pn||'');return d.length>4?'•'.repeat(Math.min(5,d.length-4))+d.slice(-4):d};
const sbEditable=()=>!!(SB.cur&&SB.cur.status==='draft'&&canWriteShared()&&(SB.cur.owner===S.uid||S.admin));
function sbErrText(e){const m=String(e&&e.message||e||'');return m.replace(/^.*?ERROR:\s*/,'')||'שגיאה לא ידועה'}

async function sbLoad(){
  if(!sb||SB.loading)return;SB.loading=true;SB.err='';
  try{
    const [l,t]=await Promise.all([
      sb.from('sb_briefings').select('*').order('updated_at',{ascending:false}).limit(1000),
      sb.from('sb_templates').select('*').eq('is_current',true).limit(1)]);
    if(l.error)throw l.error;if(t.error)throw t.error;
    SB.list=l.data||[];SB.tpl=(t.data||[])[0]||null;SB.loaded=true;
  }catch(e){SB.err=isMissingTable(e)?'missing':('טעינת התדריכים נכשלה: '+sbErrText(e))}
  SB.loading=false;
  if(S.view==='shabbat'||S.view==='sb-archive')render();
}
const isMissingTable=e=>!!e&&(e.code==='42P01'||e.code==='PGRST205'||/relation .* does not exist|could not find the table/i.test(String(e.message||'')));
function sbMissingBanner(){return `<div class="banner bad"><b>מודול תדריך השבת עדיין לא הותקן במסד הנתונים.</b><br>יש להריץ את עדכון SQL מספר 004 ב-Supabase.</div>`}

/* ---------- מסך ראשי של המודול ---------- */
function sbHub(){
  const el=$('#dyn');if(!el)return;
  if(!SB.loaded&&!SB.err){el.innerHTML=`<div class="empty">טוען…</div>`;sbLoad();return}
  if(SB.err==='missing'){el.innerHTML=`<div class="sec-h"><h2>תדריך שבת</h2></div>${sbMissingBanner()}`;return}
  const mine=SB.list.filter(b=>b.status==='draft'&&b.owner===S.uid);
  const locked=SB.list.filter(b=>b.status==='locked'&&!b.cancelled_at).length;
  el.innerHTML=`<div class="sec-h"><h2>תדריך שבת · ${esc(SB_FW.name)}</h2></div>
   ${SB.err?`<div class="banner bad">${esc(SB.err)} <button class="btn sm" onclick="SB.loaded=false;sbHub()">נסה שוב</button></div>`:''}
   <div class="tiles">
    <div class="tile main" onclick="sbNew()"><span class="ic">${ico('plus')}</span>פתיחת תדריך חדש</div>
    <div class="tile" onclick="SB.arcSt='draft';go('sb-archive')"><span class="ic">${ico('folder')}</span>המשך תדריך שמור (${mine.length})</div>
    <div class="tile" onclick="SB.arcSt='all';go('sb-archive')"><span class="ic">${ico('chart')}</span>ארכיון תדריכים</div>
    <div class="tile" onclick="SB.arcSt='locked';go('sb-archive')" style="${S.admin?'':'grid-column:1/-1;flex-direction:row;min-height:96px'}"><span class="ic">${ico('sb')}</span>צפייה בדוחות חתומים (${locked})</div>
    ${S.admin?`<div class="tile" onclick="go('sb-tpl')"><span class="ic">${ico('users')}</span>ניהול תבניות תדריך</div>`:''}
   </div>
   ${mine.length?`<div class="sec-h"><h2>הטיוטות שלי</h2></div><div class="lst">${mine.map(sbCard).join('')}</div>`:''}
   <p class="small" style="margin-top:14px">${esc(SB_DISCLAIMER)}</p>`;
}
function sbCard(b){
  const n=sbItems(b).length,a=sbAnswered(b),g=sbGaps(b).length;
  return `<div class="card" onclick="sbOpen('${b.id}')"><div class="top"><div>
   <div class="num">${b.report_no?esc(b.report_no):'טיוטה'}${b.version>1?` · גרסה ${b.version}`:''}</div>
   <div><b>${esc(b.unit||'ללא יחידה')}</b>${b.location?' · '+esc(b.location):''}</div>
   <div class="meta">${fmtDT(b.briefing_at||b.created_at)} · ${esc(sbPresenter(b))}</div>
   ${b.status==='draft'?`<div class="meta">הושלמו ${a} מתוך ${n} סעיפים</div>`:''}</div>
   <div style="text-align:left">${sbMenuItems(b).length?`<button class="btn sm ghost" style="padding:2px 12px;font-size:1.2rem;line-height:1;margin-bottom:6px" aria-label="אפשרויות" onclick="event.stopPropagation();sbMenu('${b.id}')">⋮</button><br>`:''}<span class="badge ${b.cancelled_at?'b-red':b.status==='locked'?'b-done':'b-draft'}">${b.cancelled_at?'בוטל':b.status==='locked'?'נחתם ואושר':'טיוטה'}</span>${g?`<div style="margin-top:6px"><span class="badge b-red">${g} פערים</span></div>`:''}</div></div></div>`;
}

/* ---------- ארכיון ---------- */
function sbArchiveShell(){
  $('#main').innerHTML=`<div class="sec-h"><h2>ארכיון תדריכי שבת</h2><button class="btn sm ghost" onclick="go('shabbat')">חזרה</button></div>
   <div class="grid2"><div><label class="f">מתאריך</label><input class="in" type="date" id="sbFrom" onchange="sbArchive()"></div><div><label class="f">עד תאריך</label><input class="in" type="date" id="sbTo" onchange="sbArchive()"></div>
   <div><label class="f">יחידה</label><input class="in" id="sbUnit" oninput="sbArchive()"></div><div><label class="f">מעביר התדריך</label><input class="in" id="sbPres" oninput="sbArchive()"></div></div>
   <div class="chips" id="sbStc" style="margin-top:10px"></div><div class="lst" id="sbList"></div>`;
}
function sbArchive(){
  const L=$('#sbList');if(!L)return;
  const st=[['all','הכל'],['draft','טיוטות'],['locked','נחתמו ואושרו'],['gaps','עם פערים פתוחים'],['cancelled','מבוטלים']];
  $('#sbStc').innerHTML=st.map(([k,l])=>`<button class="chip ${SB.arcSt===k?'on':''}" onclick="SB.arcSt='${k}';sbArchive()">${l}</button>`).join('');
  if(SB.err==='missing'){L.innerHTML=sbMissingBanner();return}
  if(!SB.loaded){L.innerHTML=`<div class="empty">טוען…</div>`;sbLoad();return}
  const f=$('#sbFrom').value,t=$('#sbTo').value,u=$('#sbUnit').value.trim(),p=$('#sbPres').value.trim();
  let A=SB.list.slice();
  if(SB.arcSt==='draft')A=A.filter(b=>b.status==='draft');else if(SB.arcSt==='locked')A=A.filter(b=>b.status==='locked'&&!b.cancelled_at);else if(SB.arcSt==='cancelled')A=A.filter(b=>b.cancelled_at);else if(SB.arcSt==='gaps')A=A.filter(b=>sbGaps(b).length);
  const day=b=>String(b.briefing_at||b.created_at||'').slice(0,10);
  if(f)A=A.filter(b=>day(b)>=f);if(t)A=A.filter(b=>day(b)<=t);
  if(u)A=A.filter(b=>(b.unit||'').includes(u));if(p)A=A.filter(b=>sbPresenter(b).includes(p));
  L.innerHTML=(SB.err?`<div class="banner bad">${esc(SB.err)}</div>`:'')+(A.map(b=>{const g=sbGaps(b).length;return `<div>${sbCard(b)}<div class="row" style="margin:-4px 0 12px;gap:8px">
     <button class="btn sm ghost" onclick="sbOpen('${b.id}')">צפייה</button>
     ${b.status==='locked'&&!b.cancelled_at?`<button class="btn sm gold" onclick="sbPdf('${b.id}')">📄 הורדת PDF</button>`:''}
     ${g?`<button class="btn sm ghost" onclick="sbShowGaps('${b.id}')">פערים פתוחים (${g})</button>`:''}</div></div>`}).join('')||`<div class="empty">לא נמצאו תדריכים</div>`);
}
function sbShowGaps(id){
  const b=SB.list.find(x=>x.id===id)||SB.cur;if(!b)return;
  const g=sbGaps(b);
  modal(`<h3>פערים פתוחים – ${b.report_no?esc(b.report_no):'טיוטה'}</h3>${g.map(it=>`<div class="card"><b>${esc(it.text)}</b><div class="small">סיבה: ${esc(sbAns(b,it.id).reason||'—')}</div></div>`).join('')||'<p>אין פערים פתוחים.</p>'}<div class="acts"><button class="btn ghost" onclick="this.closest('.mbg').remove()">סגירה</button></div>`);
}

/* ---------- מחיקת טיוטה / ביטול תדריך חתום ---------- */
function sbMenuItems(b){const out=[];if(!b||!canWriteShared())return out;
  if(b.status==='draft'&&(b.owner===S.uid||S.admin))out.push(['del','🗑️ מחק תדריך']);
  if(b.status==='locked'&&!b.cancelled_at&&S.admin)out.push(['cancel','העברה לארכיון מבוטל']);
  if(b.status==='locked'&&b.cancelled_at&&S.admin)out.push(['purge','🗑️ מחק תדריך מבוטל']);
  return out}
function sbMenu(id){
  const b=SB.list.find(x=>x.id===id);if(!b)return;const it=sbMenuItems(b);if(!it.length)return;
  const m=modal(`<h3>${b.report_no?esc(b.report_no):'טיוטה'} · ${esc(b.unit||'ללא יחידה')}</h3><div class="acts" style="flex-direction:column">${it.map(([k,l])=>`<button class="btn ${k==='del'||k==='purge'?'danger':''}" data-m="${k}">${l}</button>`).join('')}<button class="btn ghost" data-m="x">סגירה</button></div>`);
  m.addEventListener('click',e=>{const x=e.target.closest('[data-m]');if(!x)return;m.remove();if(x.dataset.m==='del')sbDelete(id);else if(x.dataset.m==='cancel')sbCancel(id);else if(x.dataset.m==='purge')sbPurge(id)});
}
function sbAfterChange(){if(S.view==='sb-archive')sbArchive();else if(S.view==='shabbat')sbHub()}
async function sbDelete(id){
  const b=SB.list.find(x=>x.id===id);if(!b)return;
  if(b.status!=='draft'){toast('תדריך חתום ומאושר אינו ניתן למחיקה');return}
  if(!await ask('מחיקת תדריך','<p>האם אתה בטוח שברצונך למחוק את התדריך?</p>','אישור מחיקה',true))return;
  try{
    const p=await sb.from('sb_participants').select('sig_path').eq('briefing_id',id);if(p.error)throw p.error;
    const r0=await sb.from('sb_briefings').select('presenter_sig,status').eq('id',id).maybeSingle();if(r0.error)throw r0.error;
    if(!r0.data)throw new Error('התדריך לא נמצא');if(r0.data.status!=='draft')throw new Error('תדריך חתום ומאושר אינו ניתן למחיקה');
    const files=[...(p.data||[]).map(x=>x.sig_path),r0.data.presenter_sig].filter(Boolean);
    if(files.length){const rm=await sb.storage.from(SB_BUCKET).remove(files);if(rm.error)throw rm.error}
    const r=await sb.rpc('sb_delete_draft',{p_briefing:id});if(r.error)throw r.error;
  }catch(e){toast('המחיקה נכשלה: '+sbErrText(e),5000);return}
  SB.list=SB.list.filter(x=>x.id!==id);LS.del('ogmar96:sb:'+id);if(SB.cur&&SB.cur.id===id){SB.cur=null;SB.parts=[];SB.dirty=false}
  toast('התדריך נמחק');sbAfterChange();
}
async function sbPurge(id){
  const b=SB.list.find(x=>x.id===id);if(!b||!S.admin)return;
  if(!b.cancelled_at){toast('ניתן למחוק כך רק תדריך שבוטל');return}
  if(!await ask('מחיקת תדריך מבוטל',`<p>האם אתה בטוח שברצונך למחוק את התדריך?</p><p class="small">התדריך <b class="ltr">${esc(b.report_no||'')}</b>, המשתתפים והחתימות יימחקו לצמיתות, ולא ניתן יהיה לשחזר אותם. המחיקה תירשם ביומן.</p>`,'אישור מחיקה',true))return;
  try{
    const r0=await sb.from('sb_briefings').select('presenter_sig,status,cancelled_at').eq('id',id).maybeSingle();if(r0.error)throw r0.error;
    if(!r0.data)throw new Error('התדריך לא נמצא');if(!r0.data.cancelled_at)throw new Error('ניתן למחוק כך רק תדריך שבוטל');
    const ch=await sb.from('sb_briefings').select('id').eq('supersedes',id);if(ch.error)throw ch.error;
    if((ch.data||[]).length)throw new Error('קיימת גרסה מתוקנת שנוצרה מהתדריך הזה, ולכן אי אפשר למחוק אותו');
    const p=await sb.from('sb_participants').select('sig_path').eq('briefing_id',id);if(p.error)throw p.error;
    const files=[...(p.data||[]).map(x=>x.sig_path),r0.data.presenter_sig].filter(Boolean);
    if(files.length){const rm=await sb.storage.from(SB_BUCKET).remove(files);if(rm.error)throw rm.error}
    const r=await sb.rpc('sb_purge_cancelled',{p_briefing:id});if(r.error)throw r.error;
  }catch(e){toast('המחיקה נכשלה: '+sbErrText(e),5000);return}
  SB.list=SB.list.filter(x=>x.id!==id);if(SB.cur&&SB.cur.id===id){SB.cur=null;SB.parts=[]}
  toast('התדריך המבוטל נמחק');sbAfterChange();
}
function sbCancel(id){
  const b=SB.list.find(x=>x.id===id);if(!b||!S.admin)return;
  const m=modal(`<h3>העברה לארכיון מבוטל</h3><p>התדריך <b class="ltr">${esc(b.report_no)}</b> נחתם ואושר, ולכן לא יימחק. הוא יסומן כמבוטל ויישמר בארכיון, עם סיבת הביטול, התאריך ושם המבצע.</p>
   <label class="f">סיבת הביטול (חובה)</label><textarea class="in" id="sbCr"></textarea>
   <div class="acts"><button class="btn danger" data-c="ok">אישור ביטול התדריך</button><button class="btn ghost" data-c="x">ביטול</button></div>`);
  m.addEventListener('click',async e=>{const x=e.target.closest('[data-c]');if(!x)return;
    if(x.dataset.c==='x'){m.remove();return}
    const reason=m.querySelector('#sbCr').value.trim();if(reason.length<3){toast('יש לרשום את סיבת הביטול');return}
    x.disabled=true;const r=await sb.rpc('sb_cancel',{p_briefing:id,p_reason:reason});
    if(r.error){x.disabled=false;toast('הביטול נכשל: '+sbErrText(r.error),5000);return}
    m.remove();const q=await sb.from('sb_briefings').select('*').eq('id',id).maybeSingle();
    if(q.data){const i=SB.list.findIndex(z=>z.id===id);if(i>=0)SB.list[i]=q.data}
    toast('התדריך הועבר לארכיון המבוטלים');sbAfterChange();
  });
}

/* ---------- פתיחה, טעינה ושמירה ---------- */
async function sbNew(){
  if(!canWriteShared()){toast('אין לך הרשאה לפתוח תדריך');return}
  if(!SB.loaded)await sbLoad();
  if(SB.err==='missing'){toast('מודול תדריך השבת עדיין לא הותקן במסד הנתונים',4000);return}
  if(!SB.tpl){toast('לא נמצאה תבנית תדריך פעילה',4000);return}
  const me=S.profiles[S.uid]||{},nm=String(me.full_name||'').trim().split(/\s+/);
  const row={template_id:SB.tpl.id,template_version:SB.tpl.version,items:SB.tpl.categories,unit:'',location:'',briefing_at:nowISO(),
    presenter_first:nm[0]||'',presenter_last:nm.slice(1).join(' '),presenter_rank:'',presenter_role:me.role||'',presenter_pn:'',answers:{},owner:S.uid,framework:SB_FW.id};
  const r=await sb.from('sb_briefings').insert(row).select('*');
  if(r.error||!r.data||!r.data.length){toast('פתיחת התדריך נכשלה: '+sbErrText(r.error),4500);return}
  SB.list.unshift(r.data[0]);await sbOpen(r.data[0].id,true);
}
async function sbOpen(id,fresh){
  let b=SB.list.find(x=>x.id===id);
  const r=await sb.from('sb_briefings').select('*').eq('id',id).maybeSingle();
  if(r.data)b=r.data;if(!b){toast('התדריך לא נמצא');return}
  const p=await sb.from('sb_participants').select('*').eq('briefing_id',id).order('sort',{ascending:true});
  if(p.error){toast('טעינת המשתתפים נכשלה: '+sbErrText(p.error),4500);return}
  SB.cur=JSON.parse(JSON.stringify(b));SB.parts=p.data||[];SB.step=fresh?0:(SB.cur.status==='locked'?SB.cur.items.length+2:0);SB.dirty=false;SB.saveState='saved';
  const loc=LS.get('ogmar96:sb:'+id);
  if(loc&&!loc.synced&&loc.uid===S.uid&&SB.cur.status==='draft'&&sbEditable()){Object.assign(SB.cur,loc.f);SB.dirty=true;SB.saveState='local';setTimeout(()=>sbSave(),300)}
  S.view='sb';if(location.hash!=='#sb')location.hash='sb';else{shell();}
}
const SB_FIELDS=['unit','location','briefing_at','presenter_first','presenter_last','presenter_rank','presenter_role','presenter_pn','answers','gaps_ack'];
function sbChanged(){
  const c=SB.cur;if(!c)return;SB.dirty=true;SB.saveState='local';
  const f={};SB_FIELDS.forEach(k=>f[k]=c[k]);LS.set('ogmar96:sb:'+c.id,{uid:S.uid,f,synced:false,at:nowISO()});
  sbPill();clearTimeout(SB.timer);SB.timer=setTimeout(()=>sbSave(),1800);
}
async function sbSave(){
  const c=SB.cur;if(!c||!sbEditable())return true;
  clearTimeout(SB.timer);if(!SB.dirty)return true;
  if(SB.saving){SB.again=true;return false}
  SB.saving=true;SB.saveState='saving';sbPill();
  const f={};SB_FIELDS.forEach(k=>f[k]=c[k]);
  let ok=false;
  try{const r=await sb.from('sb_briefings').update(f).eq('id',c.id).select('id,updated_at');
    if(r.error)throw r.error;if(!r.data||!r.data.length)throw new Error('אין הרשאה לשמור');
    ok=true;SB.dirty=false;SB.saveState='saved';LS.set('ogmar96:sb:'+c.id,{uid:S.uid,f,synced:true});
    const i=SB.list.findIndex(x=>x.id===c.id);if(i>=0)SB.list[i]=Object.assign({},SB.list[i],f,{updated_at:r.data[0].updated_at});
  }catch(e){SB.saveState=/fetch|network|Failed/i.test(String(e&&e.message))?'local':'error';if(SB.saveState==='error')toast('שמירת התדריך נכשלה: '+sbErrText(e),4500)}
  SB.saving=false;sbPill();
  if(SB.again){SB.again=false;return sbSave()}
  return ok;
}
function sbPill(){const p=$('#sbPill');if(!p||!SB.cur)return;
  if(SB.cur.status==='locked'){p.className='pill ok';p.textContent='נעול';return}
  if(!sbEditable()){p.className='pill';p.textContent='צפייה בלבד';return}
  const m={saving:['warn','שומר…'],saved:['ok','נשמר בשרת ✓'],local:['warn',S.online?'נשמר במכשיר':'לא מקוון – נשמר במכשיר'],error:['bad','שגיאת שמירה']}[SB.saveState]||['',''];
  p.className='pill '+m[0];p.textContent=m[1];}
async function sbExit(target){
  target=target||'shabbat';
  if(SB.dirty)await sbSave();
  if(SB.dirty&&!await ask('יציאה מהתדריך','<p>יש שינויים שעדיין לא נשמרו בשרת. הם שמורים במכשיר הזה וישלחו כשהחיבור יחזור.</p><p>לצאת בכל זאת?</p>','יציאה'))return;
  SB.leaving=true;go(target);
}
window.addEventListener('beforeunload',e=>{if(S.view==='sb'&&SB.dirty){e.preventDefault();e.returnValue=''}});

/* ---------- עורך התדריך ---------- */
function sbSteps(){const c=SB.cur;return [{k:'details',t:'פרטי התדריך'},...c.items.map((cat,i)=>({k:'cat',i,t:cat.title})),{k:'parts',t:'משתתפים וחתימות'},{k:'approve',t:'אישור מעביר התדריך'}]}
function sbEditorShell(){
  const c=SB.cur;if(!c){go('shabbat');return}
  const steps=sbSteps(),n=sbItems(c).length,a=sbAnswered(c),locked=c.status==='locked';
  $('#main').innerHTML=`<div class="ahead"><div class="row"><div class="grow"><div class="small">תדריך שבת · ${esc(SB_FW.name)}</div>
     <div class="numbig">${locked?esc(c.report_no):'טיוטה'}${c.version>1?` <span class="small">(גרסה ${c.version})</span>`:''}</div></div><span class="pill" id="sbPill"></span></div>
    ${c.cancelled_at?`<div class="banner bad" style="margin-top:8px"><b>התדריך בוטל והועבר לארכיון המבוטלים.</b> ${fmtDT(c.cancelled_at)} · בוצע על ידי ${esc(nameOf(c.cancelled_by))}<br>סיבת הביטול: ${esc(c.cancel_reason||'')}</div>`:''}
    ${locked?`<div class="banner info" style="margin-top:8px"><b>התדריך נחתם, אושר וננעל לעריכה.</b> אושר ${fmtDT(c.approved_at)}. תיקון מתבצע רק בגרסה חדשה.</div>`:`<div class="banner warn" style="margin-top:8px">טיוטה – התדריך טרם נחתם ואושר.</div>`}
    <div class="prog"><i id="sbProg" style="width:${n?a/n*100:0}%"></i></div><div class="small" id="sbProgT">הושלמו ${a} מתוך ${n} סעיפים</div>
    <div class="chips" style="margin-top:8px">${steps.map((s,i)=>`<button class="chip ${SB.step===i?'on':''}" onclick="sbGo(${i})">${i+1}. ${esc(s.t)}</button>`).join('')}</div>
    ${locked?`<div class="row" style="margin-top:8px">${c.cancelled_at?'':`<button class="btn sm gold" onclick="sbPdf('${c.id}')">📄 הורדת PDF</button>`}${(c.owner===S.uid||S.admin)&&!c.cancelled_at?`<button class="btn sm ghost" onclick="sbNewVersion()">יצירת גרסה מתוקנת</button>`:''}</div>`:''}
   </div><div id="sbBody"></div>
   <div class="actbar"><button class="btn ghost" onclick="sbGo(SB.step-1)" ${SB.step===0?'disabled':''}>הקודם ›</button><button class="btn gold" onclick="${SB.step<steps.length-1?'sbGo(SB.step+1)':"sbExit()"}">${SB.step<steps.length-1?'‹ הבא':'סיום'}</button></div>`;
  sbRenderStep();sbPill();
}
async function sbGo(i){const steps=sbSteps();if(i<0||i>=steps.length)return;if(SB.dirty)sbSave();SB.step=i;sbEditorShell();window.scrollTo(0,0)}
function sbProg(){const c=SB.cur,n=sbItems(c).length,a=sbAnswered(c);const b=$('#sbProg'),t=$('#sbProgT');if(b)b.style.width=(n?a/n*100:0)+'%';if(t)t.textContent=`הושלמו ${a} מתוך ${n} סעיפים`}
function sbRenderStep(){
  const st=sbSteps()[SB.step],el=$('#sbBody'),c=SB.cur,ro=!sbEditable();
  if(st.k==='details'){
    const fld=(k,l,extra='')=>`<div><label class="f">${l}</label><input class="in" data-sbf="${k}" value="${esc(c[k]||'')}" ${ro?'readonly':''} ${extra}></div>`;
    el.innerHTML=`<div class="card"><div class="grid2">
      <div><label class="f">מסגרת</label><input class="in" value="${esc(SB_FW.name)}" readonly></div>
      <div><label class="f">סטטוס התדריך</label><input class="in" value="${c.status==='locked'?'נחתם ואושר':'טיוטה'}" readonly></div>
      ${fld('unit','יחידה')}${fld('location','מיקום')}
      <div><label class="f">תאריך ושעה</label><input class="in" type="datetime-local" data-sbf="briefing_at" value="${toLocalInput(c.briefing_at)}" ${ro?'readonly':''}></div><div></div></div>
      <div class="sec-h" style="margin-top:12px"><h2>מעביר התדריך</h2></div><div class="grid2">
      ${fld('presenter_first','שם פרטי')}${fld('presenter_last','שם משפחה')}${fld('presenter_rank','דרגה')}${fld('presenter_role','תפקיד')}
      ${fld('presenter_pn','מספר אישי','inputmode="numeric" autocomplete="off"')}</div></div>`;
  }else if(st.k==='cat'){
    const cat=c.items[st.i],items=(cat.items||[]).filter(x=>x.active!==false);
    el.innerHTML=`<div class="sec-h"><h2>${esc(cat.title)}</h2></div>${items.map((it,idx)=>sbItemHTML(it,idx+1)).join('')}<p class="small" style="margin:14px 2px">${esc(SB_DISCLAIMER)}</p>`;
  }else if(st.k==='parts')sbRenderParts();
  else sbRenderApprove();
}
function sbItemHTML(it,num){
  const c=SB.cur,a=sbAns(c,it.id),ro=!sbEditable(),dis=ro?'disabled':'';
  const on=(v,cls)=>a.s===v?`on ${cls}`:'';
  const needReason=a.s==='not'||a.s==='na',missing=needReason&&!(a.reason||'').trim();
  return `<div class="item ${a.s==='done'?'v-good':a.s==='not'?'v-bad':a.s==='na'?'v-na':''}" id="sbi-${it.id}" data-sbi="${it.id}"><div class="it-t">${num}. ${esc(it.text)}${it.required?' <span class="badge b-red">חובה</span>':''}</div>
   <div class="seg"><button data-sbs="done" class="${on('done','good')}" ${dis}>תודרך</button><button data-sbs="not" class="${on('not','bad')}" ${dis}>לא תודרך</button><button data-sbs="na" class="${on('na','gray')}" ${dis||(it.required?'disabled':'')}>לא רלוונטי</button></div>
   ${needReason?`<label class="f" style="color:${missing?'var(--bad)':'inherit'}">${a.s==='not'?'סיבה (חובה)':'נימוק קצר (חובה)'}</label><textarea class="in" data-sbr="${it.id}" style="${missing?'border-color:var(--bad)':''}" ${ro?'readonly':''}>${esc(a.reason||'')}</textarea>`:''}
   <label class="f">הערה</label><textarea class="in" data-sbn="${it.id}" style="min-height:46px" ${ro?'readonly':''}>${esc(a.note||'')}</textarea></div>`;
}
document.addEventListener('click',e=>{
  if(S.view!=='sb'||!SB.cur)return;
  const b=e.target.closest('[data-sbs]');if(!b||!sbEditable())return;
  const id=b.closest('[data-sbi]').dataset.sbi,c=SB.cur,A=c.answers||(c.answers={}),a=A[id]||(A[id]={});
  a.s=a.s===b.dataset.sbs?'':b.dataset.sbs;
  const it=sbItems(c).find(x=>x.id===id),idx=[...document.querySelectorAll('[data-sbi]')].findIndex(x=>x.dataset.sbi===id)+1;
  document.getElementById('sbi-'+id).outerHTML=sbItemHTML(it,idx);sbProg();sbChanged();
});
document.addEventListener('input',e=>{
  if(S.view!=='sb'||!SB.cur||!sbEditable())return;
  const t=e.target,c=SB.cur,A=c.answers||(c.answers={});
  if(t.dataset.sbf){const k=t.dataset.sbf;if(k==='briefing_at'){const v=new Date(t.value);if(!isNaN(v))c.briefing_at=v.toISOString()}else c[k]=t.value;sbChanged()}
  else if(t.dataset.sbr){const a=A[t.dataset.sbr]||(A[t.dataset.sbr]={});a.reason=t.value;t.style.borderColor=t.value.trim()?'':'var(--bad)';sbProg();sbChanged()}
  else if(t.dataset.sbn){const a=A[t.dataset.sbn]||(A[t.dataset.sbn]={});a.note=t.value;sbChanged()}
});

/* ---------- משתתפים וחתימות ---------- */
function sbRenderParts(){
  const el=$('#sbBody'),ro=!sbEditable(),P=SB.parts,signed=P.filter(p=>p.signed_at).length;
  el.innerHTML=`<div class="sec-h"><h2>משתתפי התדריך וחתימות</h2><span class="badge ${P.length&&signed===P.length?'b-done':'b-draft'}">נחתמו ${signed} מתוך ${P.length}</span></div>
   ${P.map((p,i)=>`<div class="card" style="border-inline-start:5px solid ${p.signed_at?'var(--ok)':'var(--gold)'}"><div class="row"><b class="grow">${i+1}. ${esc(p.rank||'')} ${esc(p.first_name)} ${esc(p.last_name)}</b>
     <span class="badge ${p.signed_at?'b-done':'b-draft'}">${p.signed_at?'נחתם':'ממתין לחתימה'}</span></div>
     <div class="small">${esc(p.role||'—')} · מ.א. <span class="ltr">${esc(sbMaskPN(p.pn))}</span>${p.signed_at?` · נחתם ${fmtDT(p.signed_at)}`:''}</div>
     ${p.sig_path?`<img class="sigimg" style="height:70px;margin-top:6px" src="${PH_PH}" data-sbsig="${esc(p.sig_path)}" alt="חתימת ${esc(p.first_name)}">`:''}
     ${ro?'':`<div class="row" style="margin-top:8px">${p.signed_at?'':`<button class="btn sm" onclick="sbSignModal('${p.id}')">✍️ חתום</button>`}<button class="btn sm ghost" onclick="sbRemovePart('${p.id}')">הסרה</button></div>`}</div>`).join('')||'<div class="card empty" style="padding:14px">טרם נרשמו משתתפים</div>'}
   ${ro?'':`<div class="card"><b>הוספת משתתף</b><div class="grid2">
     <div><label class="f">שם פרטי</label><input class="in" id="spF"></div><div><label class="f">שם משפחה</label><input class="in" id="spL"></div>
     <div><label class="f">דרגה</label><input class="in" id="spR"></div><div><label class="f">תפקיד</label><input class="in" id="spRole"></div>
     <div><label class="f">מספר אישי</label><input class="in ltr" id="spPN" inputmode="numeric" autocomplete="off"></div></div>
     <button class="btn block" style="margin-top:10px" onclick="sbAddPart()">＋ הוספת משתתף</button></div>`}`;
  sbHydrateSigs(el);
}
async function sbHydrateSigs(root){
  const imgs=[...root.querySelectorAll('img[data-sbsig]')];if(!imgs.length)return;
  try{const r=await sb.storage.from(SB_BUCKET).createSignedUrls(imgs.map(i=>i.dataset.sbsig),600);
    (r.data||[]).forEach((x,i)=>{const u=x.signedUrl||x.signedURL;if(u&&imgs[i])imgs[i].src=u})}catch(e){}
}
async function sbAddPart(){
  const v=id=>($('#'+id).value||'').trim();
  const row={briefing_id:SB.cur.id,first_name:v('spF'),last_name:v('spL'),rank:v('spR'),role:v('spRole'),pn:v('spPN').replace(/\s/g,''),sort:SB.parts.length+1};
  if(!row.first_name||!row.last_name){toast('יש למלא שם פרטי ושם משפחה');return}
  if(!/^\d{5,9}$/.test(row.pn)){toast('מספר אישי לא תקין (ספרות בלבד)');return}
  if(SB.parts.some(p=>p.pn===row.pn)){toast('משתתף עם מספר אישי זה כבר רשום');return}
  const r=await sb.from('sb_participants').insert(row).select('*');
  if(r.error||!r.data||!r.data.length){toast('הוספת המשתתף נכשלה: '+sbErrText(r.error),4500);return}
  SB.parts.push(r.data[0]);sbRenderParts();toast('המשתתף נוסף');
}
async function sbRemovePart(id){
  const p=SB.parts.find(x=>x.id===id);if(!p)return;
  if(!await ask('הסרת משתתף',`<p>להסיר את <b>${esc(p.first_name)} ${esc(p.last_name)}</b> מהתדריך?</p>${p.signed_at?'<p class="small">המשתתף כבר חתם. ההסרה תתועד ביומן.</p>':''}`,'הסרה',true))return;
  const r=await sb.from('sb_participants').delete().eq('id',id).select('id');
  if(r.error||!r.data||!r.data.length){toast('ההסרה נכשלה: '+sbErrText(r.error),4500);return}
  SB.parts=SB.parts.filter(x=>x.id!==id);sbRenderParts();
}
/* לוח חתימה: אצבע במסך מגע או עכבר במחשב */
function sbPad(cv){
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
  const cx=cv.getContext('2d');cx.scale(dpr,dpr);cx.lineWidth=2.6;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#10123a';
  cx.fillStyle='#fff';cx.fillRect(0,0,r.width,r.height);
  let down=false,strokes=0,pts=0;const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.addEventListener('pointerdown',e=>{down=true;strokes++;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);cx.beginPath();cx.moveTo(x,y)});
  cv.addEventListener('pointermove',e=>{if(!down)return;const[x,y]=pt(e);cx.lineTo(x,y);cx.stroke();pts++});
  ['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>down=false));
  return{has:()=>strokes>0&&pts>8,clear(){cx.fillStyle='#fff';cx.fillRect(0,0,r.width,r.height);strokes=0;pts=0},blob:()=>new Promise(z=>cv.toBlob(z,'image/png'))};
}
function sbSignModal(pid){
  const p=SB.parts.find(x=>x.id===pid);if(!p)return;
  const m=modal(`<h3>חתימת משתתף</h3><div class="card"><b>${esc(p.rank||'')} ${esc(p.first_name)} ${esc(p.last_name)}</b><div class="small">${esc(p.role||'')} · מ.א. <span class="ltr">${esc(sbMaskPN(p.pn))}</span></div></div>
   <label class="f">אימות זהות: 4 הספרות האחרונות של המספר האישי שלך</label><input class="in ltr" id="sgL4" inputmode="numeric" maxlength="4" autocomplete="off" style="letter-spacing:6px;text-align:center">
   <label class="f">חתום כאן באצבע או בעכבר</label><canvas class="sig" id="sgPad" style="background:#fff"></canvas>
   <div class="acts"><button class="btn ghost" data-g="clear">נקה חתימה</button><button class="btn" data-g="ok">אשר חתימה</button><button class="btn ghost" data-g="x">ביטול</button></div>`);
  m.onclick=null;const pad=sbPad(m.querySelector('#sgPad'));
  m.addEventListener('click',async e=>{const b=e.target.closest('[data-g]');if(!b)return;
    if(b.dataset.g==='x'){m.remove();return}
    if(b.dataset.g==='clear'){pad.clear();return}
    const l4=m.querySelector('#sgL4').value.replace(/\D/g,'');
    if(l4.length!==4){toast('יש להקליד 4 ספרות');return}
    if(!pad.has()){toast('יש לחתום בתוך המסגרת');return}
    b.disabled=true;b.textContent='שומר חתימה…';
    try{const blob=await pad.blob(),path=`${SB.cur.id}/p-${p.id}-${Date.now()}.png`;
      const up=await sb.storage.from(SB_BUCKET).upload(path,blob,{contentType:'image/png',upsert:false});if(up.error)throw up.error;
      const r=await sb.rpc('sb_sign_participant',{p_participant:p.id,p_path:path,p_pn_last4:l4});if(r.error)throw r.error;
      const q=await sb.from('sb_participants').select('*').eq('id',p.id).maybeSingle();if(q.data)Object.assign(p,q.data);
      m.remove();sbRenderParts();toast('החתימה נשמרה ✓');
    }catch(err){b.disabled=false;b.textContent='אשר חתימה';toast('החתימה לא נשמרה: '+sbErrText(err),5000)}
  });
}

/* ---------- אישור מעביר התדריך ונעילה ---------- */
function sbMissing(){
  const c=SB.cur,m=[],it=sbItems(c);
  ['unit','location','presenter_first','presenter_last','presenter_rank','presenter_role','presenter_pn'].forEach(k=>{if(!String(c[k]||'').trim())m.push('חסרים פרטי תדריך או פרטי מעביר התדריך (שלב 1)')});
  const un=it.filter(x=>!['done','not','na'].includes(sbAns(c,x.id).s)).length;if(un)m.push(`${un} סעיפים לא סומנו`);
  const nr=it.filter(x=>['not','na'].includes(sbAns(c,x.id).s)&&!(sbAns(c,x.id).reason||'').trim()).length;if(nr)m.push(`${nr} סעיפים ללא סיבה / נימוק`);
  if(sbGaps(c).length&&!c.gaps_ack)m.push('נדרש אישור מפורש להצגת הפערים הפתוחים');
  if(!SB.parts.length)m.push('לא נרשמו משתתפים');
  const us=SB.parts.filter(p=>!p.signed_at).length;if(us)m.push(`${us} משתתפים טרם חתמו`);
  if(!c.presenter_sig)m.push('חסרה חתימת מעביר התדריך');
  return [...new Set(m)];
}
function sbRenderApprove(){
  const c=SB.cur,el=$('#sbBody'),ro=!sbEditable(),g=sbGaps(c),na=sbNA(c),miss=sbMissing();
  el.innerHTML=`<div class="sec-h"><h2>אישור מעביר התדריך</h2></div>
   <div class="card"><b>סיכום סעיפים שלא תודרכו (${g.length})</b>${g.map(it=>`<div class="small">• ${esc(it.text)} – <b>סיבה:</b> ${esc(sbAns(c,it.id).reason||'—')}</div>`).join('')||'<div class="small">אין</div>'}
    <b style="display:block;margin-top:8px">סעיפים שסומנו כלא רלוונטיים (${na.length})</b>${na.map(it=>`<div class="small">• ${esc(it.text)} – <b>נימוק:</b> ${esc(sbAns(c,it.id).reason||'—')}</div>`).join('')||'<div class="small">אין</div>'}
    ${g.length?`<label class="row" style="margin-top:10px;font-weight:700"><input type="checkbox" id="sbAck" ${c.gaps_ack?'checked':''} ${ro?'disabled':''} onchange="SB.cur.gaps_ack=this.checked;sbChanged();sbRenderApprove()"> אני מאשר שהסעיפים שלא תודרכו יופיעו בדוח כפערים פתוחים</label>`:''}</div>
   <div class="card"><p style="font-weight:700">${esc(SB_DECL)}</p>
    <div class="grid2 small"><div>שם: <b>${esc(c.presenter_first)} ${esc(c.presenter_last)}</b></div><div>דרגה: <b>${esc(c.presenter_rank)}</b></div><div>תפקיד: <b>${esc(c.presenter_role)}</b></div><div>מספר אישי: <b class="ltr">${esc(c.presenter_pn)}</b></div><div>תאריך ושעה: <b>${fmtDT(c.approved_at||nowISO())}</b></div></div>
    <label class="f">חתימת מעביר התדריך</label>
    ${c.presenter_sig?`<img class="sigimg" src="${PH_PH}" data-sbsig="${esc(c.presenter_sig)}" alt="חתימת מעביר התדריך"><div class="small">נחתם ${fmtDT(c.presenter_signed_at)}</div>`:(ro?'<div class="small">טרם נחתם</div>':`<canvas class="sig" id="sbPresPad" style="background:#fff"></canvas><div class="row" style="margin-top:6px"><button class="btn sm ghost" onclick="SB.presPad&&SB.presPad.clear()">נקה חתימה</button><button class="btn sm" id="sbPresOk" onclick="sbSignPresenter()">אשר חתימה</button></div>`)}</div>
   ${c.status==='locked'?'':(miss.length?`<div class="banner bad"><b>עדיין לא ניתן לאשר:</b>${miss.map(x=>`<div>• ${esc(x)}</div>`).join('')}${sbFixList(c)}</div>`:'<div class="banner info">כל התנאים מולאו. אפשר לאשר ולנעול.</div>')}
   ${ro?'':`<button class="btn block" style="margin-top:6px" onclick="sbLock()" ${miss.length?'disabled':''}>אישור סופי ונעילת התדריך</button>`}`;
  if(!ro&&!c.presenter_sig){const cv=$('#sbPresPad');if(cv)SB.presPad=sbPad(cv)}
  sbHydrateSigs(el);
}
/* רשימת הסעיפים שחסר בהם סימון או סיבה – לחיצה מעבירה ישר לסעיף */
function sbFixList(c){
  const it=sbItems(c).filter(x=>{const a=sbAns(c,x.id);return !['done','not','na'].includes(a.s)||(['not','na'].includes(a.s)&&!(a.reason||'').trim())});
  if(!it.length)return '';
  return `<div style="margin-top:8px"><b>הסעיפים שצריך להשלים (לחץ כדי לעבור אליהם):</b>${it.map(x=>{const a=sbAns(c,x.id);return `<button class="link" style="display:block;text-align:right;color:inherit;text-decoration:underline" onclick="sbJump('${x.id}')">${esc(x.cat)}: ${esc(x.text)} <span class="small">(${['not','na'].includes(a.s)?'חסרה סיבה':'לא סומן'})</span></button>`}).join('')}</div>`;
}
function sbJump(id){
  const c=SB.cur;if(!c)return;const ci=c.items.findIndex(cat=>(cat.items||[]).some(x=>x.id===id));if(ci<0)return;
  sbGo(ci+1);setTimeout(()=>{const el=document.getElementById('sbi-'+id);if(el){el.scrollIntoView({block:'center'});el.style.boxShadow='0 0 0 3px var(--gold)';setTimeout(()=>el.style.boxShadow='',2500)}},80);
}
async function sbSignPresenter(){
  const pad=SB.presPad,b=$('#sbPresOk');if(!pad||!pad.has()){toast('יש לחתום בתוך המסגרת');return}
  b.disabled=true;
  try{await sbSave();const blob=await pad.blob(),path=`${SB.cur.id}/presenter-${Date.now()}.png`;
    const up=await sb.storage.from(SB_BUCKET).upload(path,blob,{contentType:'image/png',upsert:false});if(up.error)throw up.error;
    const r=await sb.rpc('sb_sign_presenter',{p_briefing:SB.cur.id,p_path:path});if(r.error)throw r.error;

async function sbLock(){
  const c=SB.cur,miss=sbMissing();if(miss.length){toast(miss[0]);return}
  const g=sbGaps(c),na=sbNA(c);
  if(!await ask('אישור סופי ונעילת התדריך',`<p>לאחר האישור התדריך יינעל לעריכה, החתימות יישמרו וייווצר מספר דוח.</p><p>לא תודרכו: <b>${g.length}</b> · לא רלוונטיים: <b>${na.length}</b> · משתתפים שחתמו: <b>${SB.parts.length}</b></p>`,'אישור ונעילה'))return;

  LS.del('ogmar96:sb:'+c.id);toast('התדריך אושר וננעל ✓ מספר דוח: '+r.data,4500);

/* ============ ניהול שאלות הביקורת (מנהל המערכת) ============ */
/* כל שמירה יוצרת גרסה חדשה בטבלה audit_templates. כל ביקורת זוכרת את הגרסה שבה נפתחה (data.tplv).
   ביקורת בלי tplv, או כשאין גרסה שמורה – משתמשת בשאלון המקורי שבקוד. */
const QT={vers:{},cur:0,loaded:false,missing:false};
const QE={work:null,cat:0,dirty:false,base:0};
async function loadQT(){
  if(!sb)return;
  try{
    const r=await sb.from('audit_templates').select('version,data').order('version',{ascending:true});
    if(r.error){QT.missing=isMissingTable(r.error);return}
    QT.vers={};(r.data||[]).forEach(x=>QT.vers[x.version]=x.data);
    QT.cur=(r.data||[]).length?r.data[r.data.length-1].version:0;QT.loaded=true;QT.missing=false;
  }catch(e){}
}
const TYL=()=>Object.entries(TY).map(([k,v])=>[k,`${v.g} / ${v.b}`]);
const qtSec=si=>QE.work[QE.cat].secs[si];
function qtShell(){
  const el=$('#main');
  if(!S.admin){el.innerHTML=`<div class="empty">מסך זה זמין למנהל המערכת בלבד.</div>`;return}
  const head=`<div class="sec-h"><h2>ניהול שאלות הביקורת</h2><button class="btn sm ghost" onclick="qtBack()">חזרה</button></div>`;
  if(QT.missing){el.innerHTML=head+`<div class="banner bad"><b>ניהול השאלות עדיין לא הותקן במסד הנתונים.</b><br>יש להריץ את עדכון SQL מספר 007 ב-Supabase.</div>`;return}
  if(!QE.work){QE.work=qtWorkFrom(QT.cur);QE.base=QT.cur;QE.dirty=false;if(QE.cat>=QE.work.length)QE.cat=0}
  const W=QE.work,cat=W[QE.cat];
  el.innerHTML=head+`<div class="banner info">גרסת השאלון הנוכחית: <b>${QT.cur||'מקורית'}</b>. שמירה יוצרת גרסה חדשה, והיא חלה רק על ביקורות שייפתחו מעכשיו. ביקורות קיימות, דוחות ה-PDF והליקויים שלהן נשארים עם השאלות שלהן.</div>
   ${W.length>1?`<div class="chips" style="margin-bottom:8px">${W.map((c,i)=>`<button class="chip ${i===QE.cat?'on':''}" onclick="QE.cat=${i};qtShell()">${esc(c.t)}</button>`).join('')}</div>`:''}
   ${cat.secs.map((s,si)=>{const act=s.items.filter(x=>x.active!==false).length;return `<div class="card"><div class="row"><b class="grow">${esc(s.t)}</b><span class="small">${act} שאלות</span></div>
     ${s.items.map((it,ii)=>it.active===false?`<div class="item v-na" style="opacity:.65"><div class="small"><s>${esc(it.t)}</s> · נמחקה</div><button class="btn sm ghost" style="margin-top:6px" onclick="qtRestore(${si},${ii})">שחזור</button></div>`:
     `<div class="item"><div class="small ltr" style="text-align:right">${esc(it.key)}${it._new?' · חדשה':''}</div>
       <textarea class="in" data-qtt="${si}:${ii}" style="min-height:52px" placeholder="נוסח השאלה">${esc(it.t)}</textarea>
       <div class="row" style="margin-top:6px"><select class="in" data-qty="${si}:${ii}" style="flex:1;min-width:150px" aria-label="סוג התשובה">${TYL().map(([k,l])=>`<option value="${k}" ${it.ty===k?'selected':''}>${esc(l)}</option>`).join('')}</select>
       <button class="btn sm ghost" onclick="qtMove(${si},${ii},-1)" ${ii===0?'disabled':''} aria-label="הזזה למעלה">▲</button><button class="btn sm ghost" onclick="qtMove(${si},${ii},1)" ${ii===s.items.length-1?'disabled':''} aria-label="הזזה למטה">▼</button>
       <button class="btn sm danger" onclick="qtDel(${si},${ii})">מחיקה</button></div></div>`).join('')}
     <button class="btn sm" style="margin-top:8px" onclick="qtAdd(${si})">＋ הוספת שאלה</button></div>`}).join('')}
   <button class="btn block" id="qtSaveBtn" style="margin-top:8px" onclick="qtSave()" ${QE.dirty?'':'disabled'}>שמירת השאלון כגרסה חדשה</button>`;
}
function qtMark(){QE.dirty=true;const b=$('#qtSaveBtn');if(b)b.disabled=false}
document.addEventListener('input',e=>{if(S.view!=='qtpl'||!QE.work)return;const t=e.target;
  if(t.dataset.qtt){const[si,ii]=t.dataset.qtt.split(':').map(Number);qtSec(si).items[ii].t=t.value;qtMark()}});
document.addEventListener('change',e=>{if(S.view!=='qtpl'||!QE.work)return;const t=e.target;
  if(t.dataset.qty){const[si,ii]=t.dataset.qty.split(':').map(Number);qtSec(si).items[ii].ty=t.value;qtMark()}});
function qtMove(si,ii,d){const a=qtSec(si).items,j=ii+d;if(j<0||j>=a.length)return;[a[ii],a[j]]=[a[j],a[ii]];QE.dirty=true;qtShell()}
function qtAdd(si){
  qtSec(si).items.push({key:qtNewKey(QE.cat,si),t:'',ty:'ok',active:true,_new:true});QE.dirty=true;qtShell();
  setTimeout(()=>{const ts=document.querySelectorAll(`[data-qtt^="${si}:"]`),l=ts[ts.length-1];if(l){l.scrollIntoView({block:'center'});l.focus()}},50);
}
async function qtDel(si,ii){
  const s=qtSec(si),it=s.items[ii];
  if(s.items.filter(x=>x.active!==false).length<=1){toast('בכל פרק צריכה להישאר לפחות שאלה אחת');return}
  if(!await ask('מחיקת שאלה',`<p>האם למחוק את השאלה?</p><p class="small">${esc(it.t||'(ללא נוסח)')}</p><p class="small">השאלה לא תופיע בביקורות חדשות. ביקורות קיימות לא ישתנו.</p>`,'מחיקה',true))return;
  if(it._new)s.items.splice(ii,1);else it.active=false;QE.dirty=true;qtShell();
}
function qtRestore(si,ii){qtSec(si).items[ii].active=true;QE.dirty=true;qtShell()}
async function qtBack(){
  if(QE.dirty&&!await ask('יציאה בלי לשמור','<p>יש שינויים בשאלון שלא נשמרו. לצאת בכל זאת?</p>','יציאה',true))return;
  QE.work=null;QE.dirty=false;go('audits');
}
async function qtSave(){
  const W=QE.work;let empty=0;const emptySec=[];
  W.forEach(c=>c.secs.forEach(s=>{s.items.forEach(i=>{i.t=String(i.t||'').trim();if(i.active!==false&&!i.t)empty++});if(!s.items.some(i=>i.active!==false))emptySec.push((W.length>1?c.t+' – ':'')+s.t)}));
  if(empty){toast(`יש ${empty} שאלות בלי נוסח. כתוב נוסח או מחק אותן.`,4000);return}
  if(emptySec.length){toast('בכל פרק צריכה להישאר לפחות שאלה אחת: '+emptySec[0],4500);return}
  if(!await ask('שמירת השאלון',`<p>לשמור את השאלון כגרסה ${QE.base+1}?</p><p class="small">הגרסה החדשה תחול רק על ביקורות שייפתחו מעכשיו. ביקורות קיימות לא ישתנו.</p>`,'שמירה'))return;
  const b=$('#qtSaveBtn');if(b)b.disabled=true;
  const r=await sb.rpc('save_audit_template',{p_data:qtSerialize(W),p_base:QE.base});
  if(r.error){if(b)b.disabled=false;toast('השמירה נכשלה: '+String(r.error.message||'').replace(/^.*?ERROR:\s*/,''),5000);return}
  await loadQT();QE.work=null;QE.dirty=false;toast('השאלון נשמר כגרסה '+r.data+' ✓',3500);qtShell();
}
window.addEventListener('beforeunload',e=>{if(S.view==='qtpl'&&QE.dirty){e.preventDefault();e.returnValue=''}});
/* התאמה לשאלון של אוגמ״ר 96: סוגי ביקורת ופרקים קבועים, שאלות לפי גרסה */
function qtCatItems(c,v){const d=v&&QT.vers[v];const cd=d&&d.cats&&d.cats[c.id];if(!cd)return null;const out=[];
  c.secs.forEach(sc=>{const sid=c.id+'-'+sc.id;const sec=(cd.secs||[]).find(x=>x.id===sc.id);const its=sec?sec.items:c.ITEMS.filter(x=>x.sid===sid);
    its.filter(i=>i.active!==false).forEach(i=>out.push({key:i.key,sid,secT:sc.t,t:i.t,ty:TY[i.ty]?i.ty:'ok',cat:c.id,n:out.length+1}))});return out}
function qtWorkFrom(v){const d=v&&QT.vers[v];return CATS.map(c=>{const cd=d&&d.cats&&d.cats[c.id];return{id:c.id,t:c.t,secs:c.secs.map(sc=>{const sid=c.id+'-'+sc.id;
  const sec=cd&&(cd.secs||[]).find(x=>x.id===sc.id);const its=sec?sec.items:c.ITEMS.filter(x=>x.sid===sid);return{id:sc.id,t:sc.t,items:its.map(i=>({key:i.key,t:i.t,ty:i.ty,active:i.active!==false}))}})}})}
function qtSerialize(W){const cats={};W.forEach(c=>cats[c.id]={secs:c.secs.map(s=>({id:s.id,items:s.items.map(i=>({key:i.key,t:i.t,ty:i.ty,active:i.active!==false}))}))});return{cats}}
function qtNewKey(ci,si){const c=CATS.find(x=>x.id===QE.work[ci].id);const pre=`${c.p}${si+1}-`;const used=new Set(Object.keys(IT));
  Object.values(QT.vers).forEach(d=>Object.values(d.cats||{}).forEach(cd=>(cd.secs||[]).forEach(s=>s.items.forEach(i=>used.add(i.key)))));
  QE.work.forEach(c2=>c2.secs.forEach(s=>s.items.forEach(i=>used.add(i.key))));let n=0;used.forEach(k=>{if(k.startsWith(pre)){const m=+k.slice(pre.length);if(m>n)n=m}});return pre+String(n+1).padStart(2,'0')}

init();
